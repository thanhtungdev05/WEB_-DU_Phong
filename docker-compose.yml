services:
  ftc-virtual:
    build: .
    image: ftc-virtual:latest
    container_name: ftc-virtual
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8080"
      API_PORT: "8081"
      DJANGO_PORT: "8083"
      INSIDE_DOCKER_CONTAINER: "1"
    ports:
      - "8080:8080"
    restart: unless-stopped
