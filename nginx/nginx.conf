user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Ghi log dinh dang JSON/Structured de de dang giam sat
    log_format main_timed '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for" '
                          'rt=$request_time uct="$upstream_connect_time" '
                          'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main_timed buffer=64k flush=5m;
    error_log  /var/log/nginx/error.log warn;

    # Toi uu hoa I/O va mang
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens   off;

    # Gioi han kich thuoc body (ho tro upload mau danh sach KTV XLSX 25MB)
    client_max_body_size 30M;
    client_body_buffer_size 128k;

    # Toi uu nen du lieu Gzip (giam 75% bang thong cho 1.000 KTV tinh xa)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # 1. Upstream cho Simulators (Dung ip_hash de dam bao Sticky Session cho moi KTV)
    upstream simulator_backend {
        ip_hash;
        server app:8080;
        keepalive 128;
    }

    # 2. Upstream cho PHP API (Login, cham diem, lop hoc)
    upstream php_api_backend {
        server app:8081;
        keepalive 32;
    }

    # 3. Upstream cho Django Admin Panel
    upstream django_admin_backend {
        server app:8083;
        keepalive 16;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        root /app;

        # Bao mat co ban
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Chặn truy cập trực tiếp các file nhạy cảm
        location ~* (^|/)(\.env|\.git|\.dockerignore|composer\.(json|lock)|requirements.*|Dockerfile|docker-compose.*|\.sh|\.sql|\.py|\.log|\.lock)$ {
            deny all;
            return 404;
        }

        # 1. PHỤC VỤ FILE TĨNH TRỰC TIẾP (Bỏ qua Python/PHP, giảm 80% tải CPU)
        location ~* ^/(assets|devices|login|templates)/ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
            access_log off;
            try_files $uri =404;
        }

        location ~* \.(ico|css|js|gif|jpe?g|png|svg|woff2?|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
            access_log off;
            try_files $uri @simulator;
        }

        # 2. ĐIỀU HƯỚNG API PHP TRỰC TIẾP (Không đi qua Python Dispatcher)
        location /api/ {
            proxy_pass http://php_api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 15s;
            proxy_read_timeout 90s;
            proxy_send_timeout 90s;
        }

        # 3. ĐIỀU HƯỚNG DJANGO ADMIN (Chuyên trách bởi Gunicorn)
        location /admin/ {
            proxy_pass http://django_admin_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 15s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        location /static/admin/ {
            proxy_pass http://django_admin_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            expires 7d;
            access_log off;
        }

        # 4. ĐIỀU HƯỚNG SIMULATORS & PORTAL CHÍNH
        location / {
            try_files $uri $uri/ @simulator;
        }

        location @simulator {
            proxy_pass http://simulator_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 15s;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }
    }
}
