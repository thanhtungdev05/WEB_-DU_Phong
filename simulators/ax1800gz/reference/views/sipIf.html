$(".utf8Compatible", template).each(function(){
var thisObj = $(this);
var dTip = thisObj.text();
var dTipArr = dTip.split("");
var firstNum = "";
var secNum = "";
var firstNumStart = "";
var firstNumEnd = "";
var secNumStart = "";
var secNumEnd = "";
var Nums = 0;
var newTip = "";
dTipArr = $.grep(dTipArr, function(n,i){
return n != " ";
});
dTip = dTipArr.join("");
for(var i=0; i<dTipArr.length; i++)
{
if (Nums > 2)
{
thisObj.remove();
break;
}
if (isNaN(dTipArr[i]) == false)
{
if (firstNumStart == "")
{
firstNumStart = i;
firstNumEnd = parseInt(i)+1;
Nums += 1;
}
else
{
if (secNumStart == "")
{
if (firstNumEnd == i)
{
firstNumEnd = parseInt(i)+1;
}
else
{
secNumStart = i;
secNumEnd = parseInt(i)+1;
Nums += 1;
}
}
else
{
if (secNumEnd == i)
{
secNumEnd = parseInt(i)+1;
}
else
{
Nums = 3;
}
}
}
}
}
if (firstNumStart != "" && secNumStart != "")
{
firstNum = dTip.slice(firstNumStart, firstNumEnd);
secNum = dTip.slice(secNumStart, secNumEnd);
newTip = dTip.slice(0, firstNumStart)+" ";
if (parseInt(secNum) < 3)
{
var prevObjId = thisObj.prev().attr("id");
alert("Element[id='"+prevObjId+"']'s length range ["+ firstNum+","+secNum+"] will be invalid after utf-8 transforming!");
}
else
{
firstNum = Math.ceil(parseInt(firstNum) / 3);
secNum = Math.floor(parseInt(secNum) / 3);
if (firstNum < secNum)
{
firstNum=reformString(firstNum.toString(), 3);
secNum=reformString(secNum.toString(), 3);
newTip += firstNum + " ~ " + secNum;;
}
else if (firstNum == secNum)
{
secNum=reformString(secNum.toString(), 3);
newTip += secNum;
}
else
{
var prevObjId = thisObj.prev().attr("id");
alert("Element[id='"+prevObjId+"']'s length range ["+firstNum+","+secNum+"] is invalid after utf-8 transforming!");
}
}
}
else
{
thisObj.remove();
}
if (newTip != "")
{
thisObj.text(newTip);
}
});
template.on("focus.dTip","input[type='text'],input[type='password']", function(){
var thisObj = $(this);
if (thisObj.attr("readonly")) {
return;
}
var msg = "";
var firstTag = thisObj.next("span")
if(firstTag.length != 0 ){
msg = firstTag.not(".__CheckPwdStrength").text();

msg = thisObj.nextAll("span").not(".__CheckPwdStrength").text();

{
var pos = thisObj.offset();
var objWidth = thisObj.width();
var dhtml = "<div id='dynamicTip'><div id='dTip_l'></div>"
+ "<div id='dTip_m'>"
+ msg
+ "</div><div id='dTip_r'></div></div>";
var dtObj = $(dhtml).css({top:(pos.top-33)+'px',left:(pos.left+objWidth+8)+'px'});
dtObj.appendTo('body').fadeIn(400);
thisObj.bind("blur.dTip",function(){
dtObj.remove();
});
}
var fObj = $(":focus");
var tObj = $("#dynamicTip");
if ( (tObj.length > 0) && (fObj.attr("id") != thisObj.attr("id")) )
{
tObj.remove();
}
});

(function(){
function Customize_SipIf(paramsOBJ)
{
var ContainerOBJ = paramsOBJ["ContainerOBJ"];
var WCObj = $("[id^='WanConn']", ContainerOBJ);
WCObj.change();
var MWCObj = $("[id^='S_MediaWanConn']", ContainerOBJ);

function initial_template_SipIf(templateID)
{
var template = $("#"+templateID);
var WCName = "VoIP Signal WAN Connection";

$("[id^='WanConn']", template).change(function(event,template){
var subTemplate = $(this).parents("[id^='template_SipIf']");
var WCObj = $(this);
var WCVal = WCObj.val();
var WCOptions = WCObj.find("option");
var WCIpmode = WCObj.find("option:selected").attr("IPMode");
var MWCObj = $("[id^='S_MediaWanConn']", subTemplate);
MWCObj.empty();
var anyOption = $("<option>").val("").text("Any");
MWCObj.append(anyOption);
WCOptions.each(function(){
var thisOption = $(this);
var ipmode = thisOption.attr("IPMode");
var val = thisOption.val();
var txt = thisOption.text();
if ( (WCIpmode == 0 && txt != "Any")
|| (WCIpmode != 0 && WCVal == val)
|| (ipmode == 1 && WCIpmode ==1)
|| (ipmode == 2 && WCIpmode ==2))
{
var mwcOption = $("<option>").val(val).text(txt);
MWCObj.append(mwcOption);
}
});
MWCObj.hide().show();
});
