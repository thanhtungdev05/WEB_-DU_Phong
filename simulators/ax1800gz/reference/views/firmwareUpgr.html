$(".utf8Compatible", template).each(function(){
var thisObj = $(this);
var dTip = thisObj.text();
var dTipArr = dTip.split("");
var firstNum = "";
var secNum = "";
var firstNumStart = "";
var firstNumEnd = "";
var secNumStart = "";
var secNumEnd = "";
var Nums = 0;
var newTip = "";
dTipArr = $.grep(dTipArr, function(n,i){
return n != " ";
});
dTip = dTipArr.join("");
for(var i=0; i<dTipArr.length; i++)
{
if (Nums > 2)
{
thisObj.remove();
break;
}
if (isNaN(dTipArr[i]) == false)
{
if (firstNumStart == "")
{
firstNumStart = i;
firstNumEnd = parseInt(i)+1;
Nums += 1;
}
else
{
if (secNumStart == "")
{
if (firstNumEnd == i)
{
firstNumEnd = parseInt(i)+1;
}
else
{
secNumStart = i;
secNumEnd = parseInt(i)+1;
Nums += 1;
}
}
else
{
if (secNumEnd == i)
{
secNumEnd = parseInt(i)+1;
}
else
{
Nums = 3;
}
}
}
}
}
if (firstNumStart != "" && secNumStart != "")
{
firstNum = dTip.slice(firstNumStart, firstNumEnd);
secNum = dTip.slice(secNumStart, secNumEnd);
newTip = dTip.slice(0, firstNumStart)+" ";
if (parseInt(secNum) < 3)
{
var prevObjId = thisObj.prev().attr("id");
alert("Element[id='"+prevObjId+"']'s length range ["+ firstNum+","+secNum+"] will be invalid after utf-8 transforming!");
}
else
{
firstNum = Math.ceil(parseInt(firstNum) / 3);
secNum = Math.floor(parseInt(secNum) / 3);
if (firstNum < secNum)
{
firstNum=reformString(firstNum.toString(), 3);
secNum=reformString(secNum.toString(), 3);
newTip += firstNum + " ~ " + secNum;;
}
else if (firstNum == secNum)
{
secNum=reformString(secNum.toString(), 3);
newTip += secNum;
}
else
{
var prevObjId = thisObj.prev().attr("id");
alert("Element[id='"+prevObjId+"']'s length range ["+firstNum+","+secNum+"] is invalid after utf-8 transforming!");
}
}
}
else
{
thisObj.remove();
}
if (newTip != "")
{
thisObj.text(newTip);
}
});
template.on("focus.dTip","input[type='text'],input[type='password']", function(){
var thisObj = $(this);

}
var msg = "";

var dhtml = "<div id='dynamicTip'><div id='dTip_l'></div>"
+ "<div id='dTip_m'>"
+ msg
+ "</div><div id='dTip_r'></div></div>";
var dtObj = $(dhtml).css({top:(pos.top-33)+'px',left:(pos.left+objWidth+8)+'px'});
dtObj.appendTo('body').fadeIn(400);
thisObj.bind("blur.dTip",function(){
dtObj.remove();
});
}
var fObj = $(":focus");
var tObj = $("#dynamicTip");
if ( (tObj.length > 0) && (fObj.attr("id") != thisObj.attr("id")) )
{
tObj.remove();
}
});

<script type="text/javascript">
function IfServerLive()
{
var HeadID = "FirmwareUpgr";
var Head = $("#"+HeadID);
var ServerAddr = $("address span", Head).text();
Head.succfunction = function(xml){
Head.hasError(xml);
showWaitTip(false);
return;
};
Head.failfunction = function(XMLHttpRequest,textStatus){
setTimeout("IfServerLive()", 30000);
};
Head.dataTransfer(ServerAddr, "GET", Head.succfunction,
Head.failfunction, false);
}
function queryUpgradeStatus()
{
var HeadID = "FirmwareUpgr";
var Head = $("#"+HeadID);
var ServerAddr = $("address span", Head).text();
Head.dataTransfer(ServerAddr, "GET", g_upgrQueryLogic, undefined, false);
}
function g_upgrQueryLogic(xml){
var HeadID = "FirmwareUpgr";
var Head = $("#"+HeadID);
var templateID = "template_"+ HeadID;
var template = $("#"+templateID);
if (Head.hasError(xml) == 0)
{
var OBJID = "OBJ_FAKE_UPGR_ID";
var upgrDesc = getParaValueInXML(xml, OBJID, 0, "upgrDesc");
var needRefresh = getParaValueInXML(xml, OBJID, 0, "needRefresh");
var refreshInterval = getParaValueInXML(xml, OBJID, 0, "refreshInterval");
var willReboot = getParaValueInXML(xml, OBJID, 0, "willReboot");
var confirmMsg = $("#confirmMsg");
confirmMsg.find("p").text(upgrDesc);
if ( "true" == needRefresh )
{
setTimeout("queryUpgradeStatus()", refreshInterval);
}
else
{
if ( "true" == willReboot )
{
setTimeout("IfServerLive()", parseInt("5", 10) * 60000);
}
else
{
var waitingImgArea = $("#waitingImgArea");
waitingImgArea.hide();
var confirmOK = $("#confirmOK");
$("#confirmMsg", confirmOK.parents("#tipLayer")).addClass("updFail");
var tipLayer = $("#tipLayer");
var confirmOK = $("#confirmOK", tipLayer);
confirmOK.unbind("click");
confirmOK.bind("click", function(event){
showWaitTip(false);
});
confirmOK.show();
}
}
}
}
