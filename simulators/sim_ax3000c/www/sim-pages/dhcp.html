<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/sim-pages/sim.css"></head><body>
<div class="card"><div class="hd">Reserved IP</div><div class="bd">
  <div style="margin-bottom:16px;text-align:right"><button class="btn apply btn-sm" onclick="addRow()">Add</button></div>
  <table class="tbl" id="tbl">
    <thead><tr><th>Device/MAC</th><th>Device/IP</th><th style="width:120px">Operate</th></tr></thead>
    <tbody id="tb"><tr id="empty"><td colspan="3" class="empty">No data</td></tr></tbody>
  </table>
</div></div>
<div class="actions"><button class="btn apply" onclick="simState.save()">Apply</button><button class="btn undo" onclick="location.reload()">Undo</button></div>

<datalist id="macs">
  <option value="a4:5e:60:11:22:33"></option>
  <option value="de:ad:be:ef:00:12"></option>
  <option value="12:34:56:78:9a:bc"></option>
</datalist>

<script>
function addRow(mac,ip){
  var e=document.getElementById('empty'); if(e) e.remove();
  var tr=document.createElement('tr');
  tr.innerHTML=
    '<td><input type="text" list="macs" placeholder="xx:xx:xx:xx:xx:xx" value="'+(mac||'')+'"></td>'+
    '<td><input type="text" placeholder="192.168.100.x" value="'+(ip||'')+'"></td>'+
    '<td><button class="btn undo btn-sm" onclick="delRow(this)">Delete</button></td>';
  document.getElementById('tb').appendChild(tr);
}
function delRow(b){
  b.closest('tr').remove();
  var tb=document.getElementById('tb');
  if(!tb.querySelector('tr')) tb.innerHTML='<tr id="empty"><td colspan="3" class="empty">No data</td></tr>';
}
function apply(){
  var rows=[].slice.call(document.querySelectorAll('#tb tr')).filter(function(r){return !r.querySelector('.empty');});
  var list=rows.map(function(r){var i=r.querySelectorAll('input');return {mac:i[0].value.trim(),ip:i[1].value.trim()};})
               .filter(function(x){return x.mac||x.ip;});
  for(var i=0;i<list.length;i++){
    if(!/^([0-9a-fA-F]{2}:){5}[0-9a-fA-F]{2}$/.test(list[i].mac)){alert('MAC khong hop le: '+(list[i].mac||'(trong)'));return;}
    if(!/^(\d{1,3}\.){3}\d{1,3}$/.test(list[i].ip)){alert('IP khong hop le: '+(list[i].ip||'(trong)'));return;}
  }
  console.log('[DHCP] Da luu '+list.length+' muc Reserved IP.');
}
</script>
<script src="/sim-pages/state.js"></script>
</body></html>
