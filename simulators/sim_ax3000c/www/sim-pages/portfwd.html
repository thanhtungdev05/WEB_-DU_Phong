<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/sim-pages/sim.css"></head><body>
<div class="card"><div class="hd">Port Forwards</div><div class="bd">
  <div style="margin-bottom:16px;text-align:right"><button type="button" class="btn apply btn-sm" onclick="simAdd()">Add</button></div>
  <table class="tbl"><thead><tr><th>Name</th><th>Protocol</th><th>External Port</th><th>Internal IP</th><th>Internal Port</th><th style="width:120px">Operate</th></tr></thead>

</div></div>
<div class="actions"><button class="btn apply" onclick="simState.save()">Apply</button><button class="btn undo" onclick="location.reload()">Undo</button></div>
<datalist id="macs"><option value="a4:5e:60:11:22:33"></option><option value="de:ad:be:ef:00:12"></option></datalist>
<script src="/sim-pages/table.js"></script>
<script>
simTable([
  function(v){return cText(v,'rule name');},
  function(v){return cSel(v||'TCP',['TCP','UDP','TCP+UDP']);},
  function(v){return cNum(v,'e.g. 8080');},
  function(v){return cText(v,'192.168.100.x');},
  function(v){return cNum(v,'e.g. 80');}
],6);
</script>
<script src="/sim-pages/state.js"></script>
