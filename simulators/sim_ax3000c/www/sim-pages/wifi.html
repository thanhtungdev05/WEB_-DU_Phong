<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/sim-pages/sim.css"></head>
<body>

<div class="tabs" style="margin-top: 40px;">
  <div class="tab active" data-t="host">Host SSID</div>
  <div class="tab" data-t="guest">Guest SSID</div>
  <div class="tab" data-t="specific">Specific SSID</div>
</div>

<div class="toprow">
  <span class="lbl">Use separate SSID</span>
  <label class="sw"><input type="checkbox"><span class="slider"></span></label>
</div>

<div class="card">
  <div class="hd">Wi-Fi</div>
  <div class="bd">
    <div class="row">
      <div class="lbl">SSID Enabled</div>
      <div class="ctrl"><label class="sw"><input type="checkbox" checked><span class="slider"></span></label></div>
    </div>
    <div class="row">
      <div class="lbl"><span class="req">*</span>SSID</div>
      <div class="ctrl"><input type="text" value="FPT_AX3000CV2"></div>
    </div>
    <div class="row">
      <div class="lbl"><span class="req">*</span>Encryption</div>
      <div class="ctrl"><select>
        <option>WPA2-Personal</option>
        <option>WPA2/WPA3 Mixed</option>
        <option>WPA3-Personal</option>
      </select></div>
    </div>
    <div class="row">
      <div class="lbl">Passphrase</div>
      <div class="ctrl"><div class="pass-wrap">
        <input type="password" value="fpt@12345" id="pp">
        <span class="eye" onclick="var p=document.getElementById('pp');p.type=p.type==='password'?'text':'password'">&#9673;</span>
      </div></div>
    </div>
  </div>
</div>

<div class="actions">
  <button class="btn apply" onclick="simState.save()">Apply</button>
  <button class="btn undo" onclick="location.reload()">Undo</button>
</div>

<script>
(function () {
  var tabData = {
    host: { enabled: true, ssid: 'FPT_AX3000CV2', enc: 'WPA2-Personal', pass: 'fpt@12345' },
    guest: { enabled: true, ssid: 'FPT_AX3000CV2_Guest', enc: 'WPA2-Personal', pass: 'fpt@12345' },
    specific: { enabled: true, ssid: '', enc: 'WPA2-Personal', pass: '' }
  };
  try {
    var saved = localStorage.getItem('ftc_sim_ax3000c_wifi_tabs');
    if (saved) {
      var parsed = JSON.parse(saved);
      if (parsed.host) tabData.host = parsed.host;
      if (parsed.guest) tabData.guest = parsed.guest;
      if (parsed.specific) tabData.specific = parsed.specific;
    }
  } catch (e) {}

  var currentTab = 'host';
  var swEl = document.querySelector('.card input[type="checkbox"]');
  var ssidEl = document.querySelector('.card input[type="text"]');
  var encEl = document.querySelector('.card select');
  var passEl = document.getElementById('pp');

  function saveCurrent() {
    if (!tabData[currentTab]) return;
    if (swEl) tabData[currentTab].enabled = swEl.checked;
    if (ssidEl) tabData[currentTab].ssid = ssidEl.value;
    if (encEl) tabData[currentTab].enc = encEl.value;
    if (passEl) tabData[currentTab].pass = passEl.value;
    try {
      localStorage.setItem('ftc_sim_ax3000c_wifi_tabs', JSON.stringify(tabData));
    } catch (e) {}
  }

  function loadTab(tabKey) {
    currentTab = tabKey;
    document.body.setAttribute('data-active-tab', tabKey);
    var d = tabData[tabKey] || { enabled: true, ssid: '', enc: 'WPA2-Personal', pass: '' };
    if (swEl) swEl.checked = !!d.enabled;
    if (ssidEl) ssidEl.value = d.ssid || '';
    if (encEl) encEl.value = d.enc || 'WPA2-Personal';
    if (passEl) passEl.value = d.pass || '';
  }

  if (ssidEl) ssidEl.addEventListener('input', saveCurrent);
  if (passEl) passEl.addEventListener('input', saveCurrent);
  if (swEl) swEl.addEventListener('change', saveCurrent);
  if (encEl) encEl.addEventListener('change', saveCurrent);

  document.querySelectorAll('.tabs .tab').forEach(function(t) {
    t.onclick = function() {
      saveCurrent();
      document.querySelectorAll('.tabs .tab').forEach(function(x) { x.classList.remove('active'); });
      t.classList.add('active');
      var key = t.getAttribute('data-t');
      loadTab(key);
      try {
        if (window.top && window.top.applyGuidePopups) {
          window.top.applyGuidePopups();
        }
      } catch (e) {}
      try {
        window.top.postMessage({ type: 'REQUEST_GUIDE_POPUPS' }, '*');
      } catch (e) {}
    };
  });

  // Init default active tab
  loadTab('host');
})();
</script>
<script src="/sim-pages/state.js"></script>
</body></html>
