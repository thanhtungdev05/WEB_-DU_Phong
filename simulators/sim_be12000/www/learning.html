<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1280">
    <title>Học tập - BE12000 Simulator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --sidebar-bg: #1e293b;
            --sidebar-text: #cbd5e1;
            --sidebar-hover: #334155;
            --sidebar-border: #334155;
            --primary: #0ea5e9;
            --primary-hover: #0284c7;
            --bg-color: #48c4c4;
            --card-bg: #ffffff;
            --text-dark: #334155;
            --text-light: #64748b;
            --btn-guide: #fbbf24;
            --btn-guide-hover: #f59e0b;
            --btn-practice: #0d9488;
            --btn-practice-hover: #0f766e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background: var(--bg-color);
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            box-shadow: 4px 0 15px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }

        .sidebar::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }

        .sidebar-header {
            padding: 24px 20px 16px;
            color: #f59e0b;
            font-size: 16px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: sticky;
            top: 0;
            background: var(--sidebar-bg);
            z-index: 2;
        }

        .menu-list {
            display: flex;
            flex-direction: column;
        }

        .menu-item {
            padding: 16px 20px;
            color: var(--sidebar-text);
            font-size: 14px;
            font-weight: 500;
            border-bottom: 1px solid var(--sidebar-border);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .menu-item:hover,
        .menu-item.active {
            background: var(--sidebar-hover);
            color: #fff;
            padding-left: 24px;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background: radial-gradient(circle at center, #62d6d6 0%, #3bb2b2 100%);
        }

        /* Card Modal */
        .card {
            background: var(--card-bg);
            width: 100%;
            max-width: 600px;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            animation: slideUp 0.4s ease-out;
            display: none;
        }

        .card.active {
            display: block;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-title {
            color: #008080;
            font-size: 24px;
            font-weight: 800;
            text-align: center;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .card-subtitle {
            color: var(--text-light);
            font-size: 14px;
            text-align: center;
            margin-bottom: 24px;
        }

        .instruction-box {
            background: #f8fafc;
            border-left: 4px solid #008080;
            padding: 24px;
            border-radius: 8px;
            margin-bottom: 32px;
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-dark);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
        }

        .instruction-box strong {
            color: #1e293b;
        }

        .instruction-box ul {
            list-style: none;
            margin-top: 12px;
        }

        .instruction-box ul li {
            margin-bottom: 6px;
        }

        .buttons {
            display: flex;
            gap: 16px;
        }

        .btn {
            flex: 1;
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            color: #fff;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-guide {
            background: var(--btn-guide);
            color: #1e293b;
        }

        .btn-guide:hover {
            background: var(--btn-guide-hover);
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }

        .btn-practice {
            background: var(--btn-practice);
        }

        .btn-practice:hover {
            background: var(--btn-practice-hover);
            box-shadow: 0 4px 12px rgba(13, 148, 136, 0.3);
        }
    </style>
</head>

<body>


    <div class="main-content">
        <!-- The Card Modal -->
        <div class="card" id="labCard">
            <h2 class="card-title" id="cardTitle">BÀI 1-CẤU HÌNH PPPOE</h2>
            <p class="card-subtitle">Chọn phương thức bắt đầu thực hành trên BE12000</p>

            <div class="instruction-box" id="cardContent">
                <!-- Content injected via JS -->
            </div>

            <div class="buttons">
                <button class="btn btn-guide" onclick="goGuide()">Hướng dẫn</button>
                <button class="btn btn-practice" onclick="goPractice()">Thực hành</button>
            </div>
        </div>
    </div>

    <script>
        const labs = ['Cấu hình PPPoE', 'Cấu hình WIFI', 'Cấu hình WIFI Guest', 'Cấu hình WIFI IOT', 'Thay đổi IP LAN', 'DHCP Static IP Binding', 'Static Route', 'Đồng bộ thời gian SNTP', 'Cấu hình WIFI Timer', 'Cấu hình Reboot Timer', 'Thay đổi mật khẩu Web', 'Cấu hình DNS', 'Cấu hình Port Forwarding', 'Cấu hình DMZ', 'Cấu hình Parental Control', 'Cấu hình Backup/Restore', 'Nâng cấp Firmware', 'DNS Lookup & Ping', 'Traceroute Test', 'Speed Test', 'Packet Capture', 'Packet Mirror', 'Diagnostic Log', 'System Log', 'Mesh'];
        let currentLabId = 1;

        const labContents = {
            1: `<strong>Cấu hình kết nối Internet bằng giao thức PPPoE.</strong><br><br>
                <strong>Yêu cầu:</strong><br>
                Thực hiện cấu hình kết nối WAN/Internet trên thiết bị và thiết lập kết nối PPPoE theo các thông số được cung cấp dưới đây:
                <ul>
                    <li>- Username: <strong>hnfdl-123456-789</strong></li>
                    <li>- Password: <strong>d123456</strong></li>
                </ul>`,
            2: `<strong>Cấu hình mạng Wi-Fi Band Steering.</strong><br><br>
                <strong>Yêu cầu:</strong><br>
                Thực hiện cấu hình mạng Wi-Fi Band Steering trên thiết bị. Kích hoạt tính năng Band Steering và cấu hình các thông số mạng Wi-Fi theo đúng yêu cầu dưới đây:
                <ul>
                    <li>- SSID Name: <strong>FPT Telecom</strong></li>
                    <li>- WPA Key: <strong>19006600</strong></li>
                </ul>`,
            4: `<strong>Cấu hình mạng Wi-Fi IoT.</strong><br><br>
                <strong>Yêu cầu:</strong><br>
                Thực hiện cấu hình mạng Wi-Fi IoT trên thiết bị. Thiết lập các thông số của mạng Wi-Fi IoT theo đúng yêu cầu được cung cấp.<br>
                <strong>Thông số cấu hình:</strong>
                <ul>
                    <li>- SSID Name: <strong>FPT Telecom-IoT</strong></li>
                    <li>- WPA Key: <strong>19006600</strong></li>
                </ul>`,
            6: `<strong>Cấu hình địa chỉ IP LAN.</strong><br><br>
                <strong>Yêu cầu:</strong><br>
                Thực hiện thay đổi cấu hình địa chỉ IP LAN và DHCP Server trên thiết bị theo các thông số được cung cấp dưới đây.<br>
                <strong>Thông số cấu hình:</strong>
                <ul>
                    <li>- IP Address: <strong>192.168.1.1 </strong></li>
                    <li>- IP Subnet Mask: <strong>255.255.255.0</strong></li>
                    <li>- Start IP: <strong>192.168.1.2 </strong></li>
                    <li>- IP Pool Count: <strong>253</strong></li>
                    <li>- Lease Time: <strong>2 minute or 1 hour</strong></li>
                </ul>`,
            12: `<strong>Cấu hình DNS.</strong><br><br>
                <strong>Yêu cầu:</strong><br>
                Thực hiện cấu hình DNS trên thiết bị và cấu hình các máy chủ DNS theo yêu cầu sau:<br>
                <ul>
                    <li>- DNS Server 1: <strong>210.245.31.220</strong> (DNS của FPT)</li>
                    <li>- DNS Server 2: <strong>8.8.8.8</strong> (DNS của Google)</li>
                </ul>
                <strong>Gợi ý IP DNS FPT:</strong> 210.245.31.220, 210.245.31.221 (Nam), 210.31.1.253, 21.31.1.254 (Bắc)<br>
                <strong>Gợi ý IP DNS Google:</strong> 8.8.8.8, 8.8.4.4 (GG)<br>
                <strong>Gợi ý IP DNS Cloudflare:</strong> 1.1.1.1 (CF)`,
            13: `<strong>Cấu hình Port Forwarding.</strong><br><br>
                <strong>Yêu cầu:</strong><br>
                Thực hiện cấu hình Port Forwarding trên thiết bị để chuyển tiếp lưu lượng từ cổng WAN đến thiết bị trong mạng LAN theo các thông số được cung cấp dưới đây.<br>
                <strong>Thông số cấu hình:</strong>
                <ul>
                    <li>- Name: <strong>NAT FPT</strong></li>
                    <li>- Protocol: <strong>TCP, UDP hoặc TCP/UDP</strong></li>
                    <li>- External Port (WAN): <strong>8080</strong></li>
                    <li>- Internal IP: <strong>192.168.1.100</strong></li>
                    <li>- Internal Port (LAN): <strong>8080</strong></li>
                </ul>`,
            25: `<strong>Cấu hình Mesh Wifi.</strong><br><br>
                <strong>Yêu cầu:</strong><br>
                Thực hiện cấu hình Mesh trên thiết bị theo các thông số được cung cấp dưới đây.<br>
                <strong>Thông số cấu hình:</strong>
                <ul>
                    <li>- Role: Chọn <strong>Controller</strong></li>
                </ul>`
        };

        function selectLab(id) {
            currentLabId = id;

            // Update active state in menu
            document.querySelectorAll('.menu-item').forEach((el) => {
                if (el.getAttribute('onclick') === 'selectLab(' + id + ')') el.classList.add('active');
                else el.classList.remove('active');
            });

            // Update Card Content
            const card = document.getElementById('labCard');
            const title = document.getElementById('cardTitle');
            const content = document.getElementById('cardContent');

            // Re-trigger animation
            card.classList.remove('active');
            void card.offsetWidth; // trigger reflow
            card.classList.add('active');

            const newLabNumbers = {
                1: { num: 1, title: 'Cấu hình PPPoE' },
                2: { num: 2, title: 'Cấu hình WIFI' },
                4: { num: 3, title: 'Cấu hình WIFI IOT' },
                12: { num: 4, title: 'Cấu hình DNS' },
                6: { num: 5, title: 'Cấu hình địa chỉ IP LAN' },
                13: { num: 6, title: 'Cấu hình Port Forwarding' },
                25: { num: 7, title: 'Cấu hình Mesh wifi' }
            };

            if (newLabNumbers[id]) {
                title.textContent = `BÀI ${newLabNumbers[id].num}-${newLabNumbers[id].title.toUpperCase()}`;
            } else {
                title.textContent = `BÀI ${id}-${labs[id - 1].toUpperCase()}`;
            }

            if (labContents[id]) {
                content.innerHTML = labContents[id];
            } else {
                content.innerHTML = `<strong>Đang cập nhật hướng dẫn cho bài thực hành này.</strong>`;
            }
        }

        function goGuide() {
            window.location.href = `login-page.html?lab=${currentLabId}&mode=guide`;
        }

        function goPractice() {
            window.location.href = `login-page.html?lab=${currentLabId}&mode=practice`;
        }

        // Initialize with lab from URL
        const urlParams = new URLSearchParams(window.location.search);
        const labParam = urlParams.get('lab');
        selectLab(labParam ? parseInt(labParam) : 1);
    </script>
</body>

</html>
