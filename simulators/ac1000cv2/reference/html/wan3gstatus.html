<script type="text/javascript">
//<![CDATA[

var Status3G = new Array();

currentIndex= "0";

Status3G=
{ 
 "status":"0",
 "auth_failures":"0",
 "count":{"txByte":"0","rxByte":"0","txPackets":"0","rxPackets":"0"}
};


function doSetVal()
{
    switch(parseInt(Status3G.status))
    {
        case 1:
            $("#state3g").html(Xwan3gstatusString[7]);
            $("#state3g").css("color","#090");
        break;
        
        case 2:
            $("#state3g").html(Xwan3gstatusString[8]);
            $("#state3g").css("color","#E08800");
        break;
    
        case 0:        
        default:
            $("#state3g").html(Xwan3gstatusString[9]);
            $("#state3g").css("color","#F00");
        break;
    }

    var failure = "ERROR_NONE";
    
    switch(parseInt(Status3G.auth_failures))
    {        
        case 0:
            failure    = XwaninfoString[36];
            break
        case 1:
            failure    = XwaninfoString[37];
            break
        case 2:
            failure    = XwaninfoString[38];
            break                    
        default:
            failure    = XwaninfoString[39];
            break
    }
    
    $("#authfail").html(failure);    
    

    $("#bytessent").html(Status3G.count.txByte);
    $("#bytesrev").html(Status3G.count.rxByte);
    $("#packetssent").html(Status3G.count.txPackets);
    $("#packetsrev").html(Status3G.count.rxPackets);    
}

function WebInit()
{
    doSetVal();
}

$(document).ready(function () {

});

//]]>
</script>
<script type="text/javascript">

var web_timeout = 0;

function WebResetTimer()
{
	$.get("resettm.html");

	web_timeout = setTimeout("XLogout();", top.XWebTimeout*1000);

function XLogout()
{
	$.post("/GponForm/LogoutForm","logout",function(){
        top.window.location.href = "logout.html";
	});	
}

function InitForm(page)
{
	$("#XWebPageName").val(page);
	$("#XForm").attr("action", "/GponForm/" + page + "_XForm");
}

function XDoSubmit()
{

}

$(function () {
	if (window.top == window.self) {

	}	 
	
	web_timeout = setTimeout("XLogout();", top.XWebTimeout*1000);
	InitForm(top.CurSubMenu);
	WebCreatMenu();
	WebLoadString();
	WebInit();
	$("input:password").attr("autocomplete","off");
	
	$("#btn_logout").click(function(){
	    $.post("/GponForm/LogoutForm","logout",function(){
            top.window.location.href = "logout.html";
	    });
	});
	
});

	window.history.forward(1);
