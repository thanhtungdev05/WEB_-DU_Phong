<script type="text/javascript">
//<![CDATA[

var LanDevStatus = 1;
var lan_dev = new Array();

LanDevStatus = 2;
lan_dev[0] = { mac: "bc:ec:a0:05:5f:8d", ip: "192.168.1.244", hostname: "thanhtung", conn_type: "1", uptime: "0h 0m ", dhcp: "1" };
wl_num  = 0;
eth_num = 1;


function showDeviceList()
{
	var i;
	for (i = 0; i < lan_dev.length; i++)
	{
		var conn_type;
		if (1 == lan_dev[i].conn_type)
		{
			conn_type = XdevtableString[5];
		}
		else if ((2 == lan_dev[i].conn_type) || (3 == lan_dev[i].conn_type))
		{
			conn_type = XdevtableString[6];
		}
		else
		{
		    conn_type = XdevtableString[7];
		}
		str = "<tr>";
		str += '<td style="word-break : break-all;">' + lan_dev[i].hostname + '<\/td>';
		str += "<td>" + lan_dev[i].ip + "<\/td>";
		str += "<td>" + lan_dev[i].mac + "<\/td>";
		str += "<td>" + conn_type + "<\/td>";
		str += "<td>" + lan_dev[i].uptime + XdevtableString[9] + "<\/td>";
		str += "<\/tr>";
		$("#device_list").append(str);
	}
	WebStyleCommonList();
}

function WebInit()
{
	showDeviceList();
}

function WebDoSubmit()
{
	$("#XForm").submit();
}

$(document).ready(function () {
	$("#btn_refresh").click(function() {
		XDoSubmit();
	});
});

//]]>
</script>
<script type="text/javascript">
//<![CDATA[

var web_timeout = 0;

function WebResetTimer()
{
	$.get("resettm.html");
	clearTimeout(web_timeout);
	web_timeout = setTimeout("XLogout();", top.XWebTimeout*1000);
}

function XLogout()
{
	$.post("/GponForm/LogoutForm","logout",function(){
        top.window.location.href = "logout.html";
	});	
}

function InitForm(page)
{
	$("#XWebPageName").val(page);
	$("#XForm").attr("action", "/GponForm/" + page + "_XForm");
}

function XDoSubmit()
{
	WebDoSubmit();
}

$(function () {
	if (window.top == window.self) {
		window.top.location.href = "index.html";
		return;
	}	 
	
	web_timeout = setTimeout("XLogout();", top.XWebTimeout*1000);
	InitForm(top.CurSubMenu);
	WebCreatMenu();
	WebLoadString();
	WebInit();
	$("input:password").attr("autocomplete","off");
	
	$("#btn_logout").click(function(){
	    $.post("/GponForm/LogoutForm","logout",function(){
            top.window.location.href = "logout.html";
	    });
	});
	
});

	window.history.forward(1);

//]]>
</script>
