<head>
<title></title>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta http-equiv="X-UA-Compatible" content="IE=9; IE=8; IE=7; IE=EDGE">

<script language="Javascript" src="script/menu.js" type="text/javascript"></script>

<style type="text/css">

<script type="text/javascript">
//<![CDATA[

//init data started
var ipv6firewallEnable = 0;
//init data end

//data from web server started
ipv6firewallEnable=1;

//data from web server end

//Client contents started

function showIgmpEnable(en)
{
	if(en)
	{
		$("#ipv6firewallEnable1").attr("checked", "checked");
	}
	else
	{
		$("#ipv6firewallEnable0").attr("checked", "checked");
	}
}

function WebDoSubmit()
{
	$("#XForm").submit();
}

//---------------init value--------------------
function WebInit()
{
	showIgmpEnable(ipv6firewallEnable);

	WebStepIndex();
}

//-------------setup triger--------------------
$(document).ready(function(){

	$("#ip6FireallApply").click(function(){
		WebDoSubmit();
	});
	
});

//client contents ended

//]]>
</script>
<script type="text/javascript">
//<![CDATA[

var web_timeout = 0;

function WebResetTimer()
{
	$.get("resettm.html");
	clearTimeout(web_timeout);
	web_timeout = setTimeout("XLogout();", top.XWebTimeout*1000);
}

function XLogout()
{
	$.post("/GponForm/LogoutForm","logout",function(){
        top.window.location.href = "logout.html";
	});	
}

function InitForm(page)
{
	$("#XWebPageName").val(page);
	$("#XForm").attr("action", "/GponForm/" + page + "_XForm");
}

function XDoSubmit()
{
	WebDoSubmit();
}

$(function () {
	if (window.top == window.self) {
		window.top.location.href = "index.html";
		return;
	}	 
	
	web_timeout = setTimeout("XLogout();", top.XWebTimeout*1000);
	InitForm(top.CurSubMenu);
	WebCreatMenu();
	WebLoadString();
	WebInit();
	$("input:password").attr("autocomplete","off");
	
	$("#btn_logout").click(function(){
	    $.post("/GponForm/LogoutForm","logout",function(){
            top.window.location.href = "logout.html";
	    });
	});
	
});

	window.history.forward(1);

//]]>
</script>
</head>
<body>
<form id="GForm" name="GForm" method="post" action="/GponForm/LogoutForm">
</form>
<form id="XForm" name="XForm" method="post" action="">
<input id="XWebPageName" name="XWebPageName" type="hidden" value="" />
<div id="wrapper">
	<div id="header">
		<h1><a id="logo"><img src="images/logo.png"/></a></h1>
		<div id="header_right">
			<table><tr><td><h2 id="device_name"></h2>
			<a href="#" class="btn" id="btn_logout"><script type="text/javascript">document.write(WebString.Logout);</script></a></td></tr></table>
		</div>
		<ul id="main_menu">
		</ul>
	</div>
	<div id="content_left">
		<ul id="sub_menu">
		</ul>
	</div>
	<div id="content_right">
		<h1 id="content_title"></h1>
		<div id="cfgarea">


		<div class="cfgstep">
			<p><strong id="XS0"></strong></p>
			<table>
				<tr >
					<td width="200" id="XS1"></td>
						<td>
							<input name="ipv6firewallEnable" id="ipv6firewallEnable1" type="radio" value="1"/>
							<label for="ipv6firewallEnable1" id="XS2"></label>
							<input name="ipv6firewallEnable" id="ipv6firewallEnable0" type="radio" value="0"/>
							<label for="ipv6firewallEnable0" id="XS3"></label>
						</td>
				</tr>
			</table>
		</div>
		<div class="cfgstep">
			<p><strong id="XS4"></strong></p>
			<a href="#" id="ip6FireallApply" class="btn apply_btn"><script type="text/javascript">
						document.write(Xipv6firewallString[5]);</script></a>
		</div>
		
		</div>
	</div>
	<div id="footer"></div>
</div>
</form>
