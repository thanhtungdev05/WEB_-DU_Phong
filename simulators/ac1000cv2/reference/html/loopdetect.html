<script type="text/javascript">
var lpenable="";
var alarmMask = 0;
var lan_num = 0;


 lpenable="1";

 alarmMask=0;

 lan_num=4;

//<![CDATA[

function FreshTable()
{
	var TR = "";
	TR += '<table width="60%" id="loopDetectTable" class="x_table">\n';
	TR += '<tr>\n';
	TR += '<th>' + XloopdetectString[3] + '</th>\n';
	TR += '<th>' + XloopdetectString[4] + '</th>\n';
	TR += '</tr>\n';
	
	for (var i = 0; i < lan_num; i++)
	{
		var tdc = "x_td1";
		var sta = (parseInt(alarmMask)&(1<<i))?"True":"False";
		if (i&1)
		{
			tdc = "x_td2";
		}

		TR += '<tr>\n';
		TR += '<td class="' + tdc + '">' + parseInt(i + 1) + '</td>\n';
		TR += '<td class="' + tdc + '">' + sta + '</td>\n';
		TR += '</tr>\n';
	}
	TR += '</table>\n';
	$("#loopDetectTableContainer").html(TR);
}

function WebInit()
{
	WebStepIndex();
	if(lpenable == "1")
	{
		$("#lpdenable1").attr("checked", true);
	}	
	else
	{
		$("#lpdenable0").attr("checked", true);
	}
	FreshTable();
}

function WebDoSubmit()
{
	//cgi code:web_diag.c
	$("#XForm").submit();
}

$(document).ready(function () {
	$("#btn_apply").click(function(){
		XDoSubmit();
	});
});

//]]>
</script>

<script type="text/javascript">
//<![CDATA[

var web_timeout = 0;

function WebResetTimer()
{
	$.get("resettm.html");
	clearTimeout(web_timeout);
	web_timeout = setTimeout("XLogout();", top.XWebTimeout*1000);
}

function XLogout()
{
	$.post("/GponForm/LogoutForm","logout",function(){
        top.window.location.href = "logout.html";
	});	
}

function InitForm(page)
{
	$("#XWebPageName").val(page);
	$("#XForm").attr("action", "/GponForm/" + page + "_XForm");
}

function XDoSubmit()
{
	WebDoSubmit();
}

$(function () {
	if (window.top == window.self) {
		window.top.location.href = "index.html";
		return;
	}	 
	
	web_timeout = setTimeout("XLogout();", top.XWebTimeout*1000);
	InitForm(top.CurSubMenu);
	WebCreatMenu();
	WebLoadString();
	WebInit();
	$("input:password").attr("autocomplete","off");
	
	$("#btn_logout").click(function(){
	    $.post("/GponForm/LogoutForm","logout",function(){
            top.window.location.href = "logout.html";
	    });
	});
	
});

	window.history.forward(1);

//]]>
</script>
