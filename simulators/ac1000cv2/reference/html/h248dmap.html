<script type="text/javascript">
//<![CDATA[

partial_timer = 0;
critical_timer = 0;
waitdial_timer = 0;
POTS_NUM = 0;


function WebDoSubmit()
{
	$("#XForm").submit();
}

function WebInit()
{
	WebStepIndex();
}

$(document).ready(function(){

	$("#digi_timer").val(partial_timer);
	$("#cri_timer").val(critical_timer);
	$("#per_timer").val(waitdial_timer);

	$("#btn_apply").click(function(){
		var ltimer = parseInt($("#digi_timer").val());
		var stimer = parseInt($("#cri_timer").val());
		var ptimer = parseInt($("#per_timer").val());
		if (ltimer < 1 || ltimer > 60)
		{
			alert(WebString.h248_long_timer);
			return false;
		}
		if (stimer < 1 || stimer > 60)
		{
			alert(WebString.h248_short_timer);
			return false;
		}
		if (stimer > ltimer)
		{
			alert(WebString.short_timer);
			return false;
		}
		if(ptimer < 1 || ptimer > 60)
		{
			alert(WebString.h248_waitdial_timer);
			return false;
		}
		XDoSubmit();
	});
});

//]]>
</script>
<script type="text/javascript">
//<![CDATA[

var web_timeout = 0;

function WebResetTimer()
{
	$.get("resettm.html");
	clearTimeout(web_timeout);
	web_timeout = setTimeout("XLogout();", top.XWebTimeout*1000);
}

function XLogout()
{
	$.post("/GponForm/LogoutForm","logout",function(){
        top.window.location.href = "logout.html";
	});	
}

function InitForm(page)
{
	$("#XWebPageName").val(page);
	$("#XForm").attr("action", "/GponForm/" + page + "_XForm");
}

function XDoSubmit()
{
	WebDoSubmit();
}

$(function () {
	if (window.top == window.self) {
		window.top.location.href = "index.html";
		return;
	}	 
	
	web_timeout = setTimeout("XLogout();", top.XWebTimeout*1000);
	InitForm(top.CurSubMenu);
	WebCreatMenu();
	WebLoadString();
	WebInit();
	$("input:password").attr("autocomplete","off");
	
	$("#btn_logout").click(function(){
	    $.post("/GponForm/LogoutForm","logout",function(){
            top.window.location.href = "logout.html";
	    });
	});
	
});

	window.history.forward(1);

//]]>
</script>
</head>
<body>
<form id="GForm" name="GForm" method="post" action="/GponForm/LogoutForm">
</form>
<form id="XForm" name="XForm" method="post" action="">

			<table><tr><td><h2 id="device_name"></h2>
			<a href="#" class="btn" id="btn_logout"><script type="text/javascript">document.write(WebString.Logout);</script></a></td></tr></table>
		</div>
		<ul id="main_menu">
		</ul>
	</div>
	<div id="content_left">
		<ul id="sub_menu">
		</ul>
	</div>
	<div id="content_right">
		<h1 id="content_title"></h1>
		<div id="cfgarea">


<div class="cfgstep">
	<p><strong id="XS0"></strong></p>
	<table>
		<tr>
			<td width="200" id="XS1"></td>
			<td>
				<input id="per_timer" name="per_timer" type="text" maxlength="2" size="6" onkeypress="return OnKeyPress(event, X_INPUT_NUM);" /> 
				<script>document.write(WebString.seconds);</script>
			</td>
		</tr>
		<tr>
			<td width="200" id="XS2"></td>
			<td>
				<input id="digi_timer" name="digi_timer" type="text" maxlength="2" size="6" onkeypress="return OnKeyPress(event, X_INPUT_NUM);" /> 
				<script>document.write(WebString.seconds);</script>
			</td>
		</tr>
		<tr>
			<td width="200" id="XS3"></td>
			<td>
				<input id="cri_timer" name="cri_timer" type="text" maxlength="2" size="6" onkeypress="return OnKeyPress(event, X_INPUT_NUM);" /> 
				<script>document.write(WebString.seconds);</script>
			</td>
		</tr>
	</table>
</div>
<div class="cfgstep">
	<p><strong><script>document.write(WebString.stepApply);</script></strong></p>
	<a href="#" id="btn_apply" class="btn"><script>document.write(WebString.Apply);</script></a>
</div>

		</div>
	</div>
