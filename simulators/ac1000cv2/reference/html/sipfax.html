<script type="text/javascript">
//<![CDATA[

var pots1_codec = new Array;
var pots2_codec = new Array;

voip_fax_pots1 = 0;
pots1_codec[0] = {"codec": 0, "pri": 0};
pots1_codec[1] = {"codec": 0, "pri": 0};
pots1_codec[2] = {"codec": 0, "pri": 0};
pots1_codec[3] = {"codec": 0, "pri": 0};
voip_enable_pots1 = 0;
rx_gain_1 = 0;
tx_gain_1 = 0;
echo_cancel_1 = 0;
vad_1 = 0;
pack_interval_1 = 0;
voip_fax_pots2 = 0;
pots2_codec[0] = {"codec": 0, "pri": 0};
pots2_codec[1] = {"codec": 0, "pri": 0};
pots2_codec[2] = {"codec": 0, "pri": 0};
pots2_codec[3] = {"codec": 0, "pri": 0};
voip_enable_pots2 = 0;
rx_gain_2 = 0;
tx_gain_2 = 0;
echo_cancel_2 = 0;
vad_2 = 0;
pack_interval_2 = 0;
oob_dtmf = 0;
dtms_events = 0;
fax_neg = 0;
rtp_dscpmark = 0;
sip_hook_timer_min = 0;
sip_hook_timer_max = 0;
country_code = 0;
POTS_NUM = 0;


function WebDoSubmit()
{
	$("#XForm").submit();
}

function WebInit()
{
	WebStepIndex();
}

$(document).ready(function(){
	
	$("#fax_mode1").val(voip_fax_pots1);
	$("#fax_mode2").val(voip_fax_pots2);
	if(POTS_NUM > 1)
	{
		$("#pots_2").show();
	}
	else
	{
		$("#pots_2").hide();
	}
	$("#btn_apply").click(function(){
	XDoSubmit();
	});
});

//]]>
</script>
<script type="text/javascript">
//<![CDATA[

var web_timeout = 0;

function WebResetTimer()
{
	$.get("resettm.html");
	clearTimeout(web_timeout);
	web_timeout = setTimeout("XLogout();", top.XWebTimeout*1000);
}

function XLogout()
{
	$.post("/GponForm/LogoutForm","logout",function(){
        top.window.location.href = "logout.html";
	});	
}

function InitForm(page)
{
	$("#XWebPageName").val(page);
	$("#XForm").attr("action", "/GponForm/" + page + "_XForm");
}

function XDoSubmit()
{
	WebDoSubmit();
}

$(function () {
	if (window.top == window.self) {
		window.top.location.href = "index.html";
		return;
	}	 
	
	web_timeout = setTimeout("XLogout();", top.XWebTimeout*1000);
	InitForm(top.CurSubMenu);
	WebCreatMenu();
	WebLoadString();
	WebInit();
	$("input:password").attr("autocomplete","off");
	
	$("#btn_logout").click(function(){
	    $.post("/GponForm/LogoutForm","logout",function(){
            top.window.location.href = "logout.html";
	    });
	});
	
});

	window.history.forward(1);

//]]>
</script>

<div class="cfgstep">

	<table>
		<tr>

			<ul style="font-weight:bold" width="200"><script>document.write(WebString.pots_if);</script></ul>
			<ul style="padding-top:10px" width="200" id="XS1"></ul>
			
		</td>

					<option value="2"><script>document.write(WebString.t30_full_ctrl);</script></option>
					<option value="1"><script>document.write(WebString.t38_fax);</script></option>
				</select>
			</ul>
		</td>
		</tr>
	</table>
</div>
<div class="cfgstep">
	<p><strong><script>document.write(WebString.stepApply);</script></strong></p>
	<a href="#" id="btn_apply" class="btn"><script>document.write(WebString.Apply);</script></a>

		</div>
	</div>
