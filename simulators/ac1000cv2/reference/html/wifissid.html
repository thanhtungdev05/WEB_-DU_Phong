function showSelectSsid()
{
	var str = "";
	var j = 0;
	for (var i = 0; i < 4; i++)
	{
	    /* if ((UserPriority != 0) && (i >= 2))
	    {
	        break;
	    } */
	    
		j = i + 1;
		str += (
			'<option value='+ i +'>' + 'SSID ' + j +'</option>'
		);
	}
	$("#ssid_list").html(str);
}

function SelectShow(i)
{
	$("#ssid_list").val(ssid_list[i]);
	
	$("#ssid_network_name").val(ssid_network_name[i]);

	if (ssid_enable[i] == '1')
	{
        /*wifi_mode 3: 11n only, security 2: wep*/
        if ((wifi_mode == 3) && (ssid_security[i] == 2))
        {
            //11n only do not support wep
            alert(WebString.mode_security_conflict); 
            $("#ssid_disable").attr("checked", true);	
        }
        else
        {
            $("#ssid_enable").attr("checked", true);
        }
	}
	else
	{	
		$("#ssid_disable").attr("checked", true);	
	}	
	if (ssid_broadcast[i] == '1')
		$("#ssid_broadcast_on").attr("checked", true);
	else
		$("#ssid_broadcast_off").attr("checked", true);
		
	if (ssid_isolation[i] == '1')
		$("#ssid_isolation_on").attr("checked", true);
	else
		$("#ssid_isolation_off").attr("checked", true);		

	if (wifi_mode == '3')
		document.getElementById("wmm_off").disabled=true;
	else 
		document.getElementById("wmm_off").disabled=false;

	if (ssid_wmm[i] == '1')
		$("#wmm_on").attr("checked", true);
	else
		$("#wmm_off").attr("checked", true);
		
	//$("#max_clients").val(ssid_max_clients[i]);	
}


function WebInit()
{
    showSelectSsid();
	
    //if ((top.WebProject != "hw") && (top.WebProject != "em"))

}

function WebDoSubmit()
{
    var ssid_network_name = $("#ssid_network_name").val();
    var ssidindex = $("#ssid_list").val();
    var enable = $("#ssid_enable").attr("checked");
    if ((wifi_mode == 3) && (ssid_security[ssidindex] == 2))
    {
        if (enable == "checked")
        {
            //11n only do not support wep
            alert(WebString.mode_security_conflict); 
            $("#ssid_disable").attr("checked", true);
            return false;
        }
    }

    if (false == isValidSsid(ssid_network_name, true))
    {
        alert(XwifissidString[19]);
        return false;
    }
    else if(ssid_network_name.length == 0)
    {
        alert(XwifissidString[10]);
        return false;
    }
    else if (ssid_network_name.charAt(0) == " ")
    {
        alert(XwifissidString[20]);
        return false;
    }
    //ssid name can't include the space character
    //else
    //{
    //    if(-1 != ssid_network_name.indexOf(" "))
    //    {
    //        alert(XwifissidString[18]);
    //        return false;
    //    }
    //}

    //var max_clients = $("#max_clients").val();
    //if( max_clients < 0 || max_clients > 32)
    //{
    //    alert(XwifissidString[15]);
    //    return false;	
    //}       

    $("#XForm").submit();
}

function select_ssid(mode)
{
	SelectShow(mode);
}


$(document).ready(function () {
	
	$("#btn_apply").click(function() {
		WebDoSubmit();
	});
});

var web_timeout = 0;

function WebResetTimer()
{
	$.get("resettm.html");

}

function XLogout()
{
	$.post("/GponForm/LogoutForm","logout",function(){
        top.window.location.href = "logout.html";
	});	
}

function InitForm(page)
{
	if (!page || page === "undefined") {
		page = (typeof getCurSubMenu === "function") ? getCurSubMenu() : "wifissid";
	}
	$("#XWebPageName").val(page);
	$("#XForm").attr("action", "/GponForm/" + page + "_XForm");
}

function XDoSubmit()
{
	WebDoSubmit();
}

$(function () {
	if (window.top == window.self) {
		window.top.location.href = "index.html";
		return;
	}	 
	
	web_timeout = setTimeout("XLogout();", top.XWebTimeout*1000);
	InitForm(top.CurSubMenu || "wifissid");
	WebCreatMenu();
	WebLoadString();
	WebInit();
	$("input:password").attr("autocomplete","off");
	
	$("#btn_logout").click(function(){
	    $.post("/GponForm/LogoutForm","logout",function(){
            top.window.location.href = "logout.html";
	    });
	});
	
});

	window.history.forward(1);
