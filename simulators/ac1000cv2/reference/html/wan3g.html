<script type="text/javascript">
//<![CDATA[

var v_apnnane = "";
var v_dialnum = "";
var v_pppuser = "";
var v_ppppwd = "";
var v_pincode = "";
var v_enable  = "1";

v_apnnane="";
v_dialnum="";
v_pppuser="";
v_ppppwd="";
v_pincode="";
v_enable="0";

currentIndex= "0";

Status3G=
{ 
 "status":"0",
 "auth_failures":"0",
 "count":{"txByte":"0","rxByte":"0","txPackets":"0","rxPackets":"0"}
};


function doSetVal()
{
    switch(parseInt(Status3G.status))
    {
        case 1:
            $("#state3g").html(Xwan3gString[2]);
            $("#state3g").css("color","#090");
            break;
        case 2:
            $("#state3g").html(Xwan3gString[3]);
            $("#state3g").css("color","#E08800");
            break;
        case 0:
        default:
            $("#state3g").html(Xwan3gString[4]);
            $("#state3g").css("color","#F00");
        break;
    }
    
    $("#apnname").val(v_apnnane);
    
    $("#dialnum").val(v_dialnum);

    $("#pppuser").val(v_pppuser);
    
    $("#ppppwd").val(v_ppppwd);
    
    $("#pincode").val(v_pincode);
    
    $("#enable3g").attr("checked", ((v_enable == "1")?true:false));
    
}

function docheckValue()
{
    if (($("#pincode").val().length != 0) && (($("#pincode").val().length < 4) || ($("#pincode").val().length > 8)))
    {
        alert(WebString.wan3gPIN);
        return false;
    } 
}

function WebInit()
{
    doSetVal();
    WebStepIndex();
}

function WebDoSubmit()
{
	if (false == docheckValue())
	{
		return;
	}
	$("#XForm").submit();
}

$(document).ready(function () {
    $("#btn_apply").click(function() {
		XDoSubmit();
	}); 

    $("#btn_reconnect").click(function() {
        $("#reconnect").val("1");
        XDoSubmit();
	}); 
    
});

//]]>
</script>
<script type="text/javascript">
//<![CDATA[

var web_timeout = 0;

function WebResetTimer()
{
	$.get("resettm.html");
	clearTimeout(web_timeout);
	web_timeout = setTimeout("XLogout();", top.XWebTimeout*1000);
}

function XLogout()
{
	$.post("/GponForm/LogoutForm","logout",function(){
        top.window.location.href = "logout.html";
	});	
}

function InitForm(page)
{
	$("#XWebPageName").val(page);
	$("#XForm").attr("action", "/GponForm/" + page + "_XForm");
}

function XDoSubmit()
{
	WebDoSubmit();
}

$(function () {
	if (window.top == window.self) {
		window.top.location.href = "index.html";
		return;
	}	 
	
	web_timeout = setTimeout("XLogout();", top.XWebTimeout*1000);
	InitForm(top.CurSubMenu);
	WebCreatMenu();
	WebLoadString();
	WebInit();
	$("input:password").attr("autocomplete","off");
	
	$("#btn_logout").click(function(){
	    $.post("/GponForm/LogoutForm","logout",function(){
            top.window.location.href = "logout.html";
	    });
	});
	
});

	window.history.forward(1);

//]]>
</script>
