<script type="text/javascript">
//<![CDATA[
var ftp_enable;
var tftp_enbale;
var sip_enable;
var h323_enable;
var rtsp_enable;
var l2tp_enable;
var ipsec_enable;
var pptp_enable;

ftp_enable="1";
tftp_enable="1";
sip_enable="0";
h323_enable="1";
rtsp_enable="1";
l2tp_enable="1";
ipsec_enable="1";

pptp_enable="1";



function radioSet(name){
	if(eval(name+"_enable")=="1"){
		$("#"+name+"0").get(0).checked=true;
		$("#"+name+"1").get(0).checked=false;
	}else{
		$("#"+name+"0").get(0).checked=false;
		$("#"+name+"1").get(0).checked=true;
	}
		
}

function WebInit(){
	WebStepIndex();
	radioSet("ftp");
	radioSet("tftp");
	radioSet("sip");
	radioSet("h323");
	radioSet("rtsp");
	radioSet("l2tp");
	radioSet("ipsec");
	radioSet("pptp");
}

function WebDoSubmit(){
	var ftp   = $("input[name='ftp']:checked").val();
	var tftp  = $("input[name='tftp']:checked").val();
	var sip   = $("input[name='sip']:checked").val();
	var h323  = $("input[name='h323']:checked").val();
	var rtsp  = $("input[name='rtsp']:checked").val();
	var l2tp  = $("input[name='l2tp']:checked").val();
	var ipsec = $("input[name='ipsec']:checked").val();
	var pptp = $("input[name='pptp']:checked").val();
		
	var value;
	
	value = ftp;
	value += ":" + tftp;
	value += ":" + sip;
	value += ":" + h323;
	value += ":" + rtsp;
	value += ":" + l2tp;
	value += ":" + ipsec;
	value += ":" + pptp;
	
	$("#alg_value").val(value);
	$("#XForm").submit();
}

$(document).ready(function () {
	$("#btn_apply").click(function(){
		XDoSubmit();
	});
});

//]]>
</script>
<script type="text/javascript">

var web_timeout = 0;

function WebResetTimer()
{
	$.get("resettm.html");
	clearTimeout(web_timeout);
	web_timeout = setTimeout("XLogout();", top.XWebTimeout*1000);
}

function XLogout()
{
	$.post("/GponForm/LogoutForm","logout",function(){
        top.window.location.href = "logout.html";
	});	
}

function InitForm(page)
{
	$("#XWebPageName").val(page);
	$("#XForm").attr("action", "/GponForm/" + page + "_XForm");
}

function XDoSubmit()
{
	WebDoSubmit();
}

$(function () {
	if (window.top == window.self) {

	web_timeout = setTimeout("XLogout();", top.XWebTimeout*1000);
	InitForm(top.CurSubMenu);

	$("#btn_logout").click(function(){
	    $.post("/GponForm/LogoutForm","logout",function(){
            top.window.location.href = "logout.html";
	    });
	});
	
});

	window.history.forward(1);

//]]>
