<script type="text/javascript">
//<![CDATA[

var export_url = "";



function WebDoSubmit()
{
	if (!confirm(WebString.backup_export_alert))
	{
		return;
	}

	$("#XForm").encoding = "application/x-www-form-urlencoded";
	$("#XForm").submit();
}

function WebInit()
{
	if (export_url.length > 8)
	{
		$("#backup_cfg").hide();
		$("#export_url").show();
	}
	//WebStepIndex();
}

$(document).ready(function () {
	$("#btn_backup").click(function(){
		XDoSubmit();
	});
});

//]]>
</script>
<script type="text/javascript">
//<![CDATA[

var web_timeout = 0;

function WebResetTimer()
{
	$.get("resettm.html");
	clearTimeout(web_timeout);
	web_timeout = setTimeout("XLogout();", top.XWebTimeout*1000);
}

function XLogout()
{
	$.post("/GponForm/LogoutForm","logout",function(){
        top.window.location.href = "logout.html";
	});	
}

function InitForm(page)
{
	$("#XWebPageName").val(page);
	$("#XForm").attr("action", "/GponForm/" + page + "_XForm");
}

function XDoSubmit()
{
	WebDoSubmit();
}

$(function () {
	if (window.top == window.self) {
		window.top.location.href = "index.html";
		return;
	}	 
	
	web_timeout = setTimeout("XLogout();", top.XWebTimeout*1000);
	InitForm(top.CurSubMenu);
	WebCreatMenu();
	WebLoadString();
	WebInit();
	$("input:password").attr("autocomplete","off");
	
	$("#btn_logout").click(function(){
	    $.post("/GponForm/LogoutForm","logout",function(){
            top.window.location.href = "logout.html";
	    });
	});
	
});

	window.history.forward(1);

//]]>
</script>
</head>
<body>
<form id="GForm" name="GForm" method="post" action="/GponForm/LogoutForm">
</form>
<form id="XForm" name="XForm" method="post" action="">
<input id="XWebPageName" name="XWebPageName" type="hidden" value="" />
<div id="wrapper">
	<div id="header">
		<h1><a id="logo"><img src="images/logo.png"/></a></h1>
		<div id="header_right">
			<table><tr><td><h2 id="device_name"></h2>
			<a href="#" class="btn" id="btn_logout"><script type="text/javascript">document.write(WebString.Logout);</script></a></td></tr></table>
		</div>
		<ul id="main_menu">
		</ul>
	</div>
	<div id="content_left">
		<ul id="sub_menu">
		</ul>
	</div>
	<div id="content_right">
		<h1 id="content_title"></h1>
		<div id="cfgarea">


<div id="backup_cfg" class="cfgstep">
	<p><strong><script>document.write(WebString.stepBackup);</script></strong></p>
	<a id="btn_backup" class="btn apply_btn" href="#"><script>document.write(WebString.Backup);</script></a>
</div>

<div id="export_url" class="cfgstep" style="display:none">
	<p><strong id="XS0"></strong></p>
	<a id="XS1" href="/download/gateway_config.dat" style="margin-left:200px"></a>
</div>

		</div>
	</div>
	<div id="footer"></div>
</div>
</form>
