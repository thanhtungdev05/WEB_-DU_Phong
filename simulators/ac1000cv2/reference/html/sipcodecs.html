<script type="text/javascript">
//<![CDATA[

var pots1_codec = new Array;
var pots2_codec = new Array;

voip_fax_pots1 = 0;
pots1_codec[0] = {"codec": 0, "pri": 0};
pots1_codec[1] = {"codec": 0, "pri": 0};
pots1_codec[2] = {"codec": 0, "pri": 0};
pots1_codec[3] = {"codec": 0, "pri": 0};
voip_enable_pots1 = 0;
rx_gain_1 = 0;
tx_gain_1 = 0;
echo_cancel_1 = 0;
vad_1 = 0;
pack_interval_1 = 0;
voip_fax_pots2 = 0;
pots2_codec[0] = {"codec": 0, "pri": 0};
pots2_codec[1] = {"codec": 0, "pri": 0};
pots2_codec[2] = {"codec": 0, "pri": 0};
pots2_codec[3] = {"codec": 0, "pri": 0};
voip_enable_pots2 = 0;
rx_gain_2 = 0;
tx_gain_2 = 0;
echo_cancel_2 = 0;
vad_2 = 0;
pack_interval_2 = 0;
oob_dtmf = 0;
dtms_events = 0;
fax_neg = 0;
rtp_dscpmark = 0;
sip_hook_timer_min = 0;
sip_hook_timer_max = 0;
country_code = 0;
POTS_NUM = 0;



function WebDoSubmit()
{
	$("#XForm").submit();
}

function WebInit()
{
	$("#outbound").hide();
	if($("#oob_dtmf").val() == 1)
	{
		$("#outbound").show();
	}
	
	WebStepIndex();
}

$(document).ready(function(){

	// G711A(8), G711U(0), G729(18), G723(4)
	var i, obj;
	for (i = 0; i < pots1_codec.length; i++)
	{
		obj = "#pots1_codec" + pots1_codec[i].pri;
		$(obj).val(pots1_codec[i].codec);
	}
	$("#oob_dtmf").val(oob_dtmf);
	$("#dtms_events").val(dtms_events);
	
	$("#oob_dtmf").change(function(){
		WebInit();
	});
	if(POTS_NUM > 1)
	{
		$("#pots_2").show();
		var i, obj;
    	for (i = 0; i < pots2_codec.length; i++)
    	{
    		obj = "#pots2_codec" + pots2_codec[i].pri;
    		$(obj).val(pots2_codec[i].codec);
    	}
	}
	else
	{
		$("#pots_2").hide();
	}
	$("#btn_apply").click(function(){
		for(var i = 0; i < POTS_NUM ; i++)
		{
			for(var j = 0; j < 3; j++)
			{
				var pname = "#pots" + (i+1) + "_codec" + (j+1);
				for (var k = j+1; k < 4; k++)
				{
					var kname = "#pots" + (i+1) + "_codec" + (k+1);
					if($(pname).val() >= 0 && $(pname).val() == $(kname).val())
					{
						alert(WebString.codec_same);
						return false;
					}
				}
			}
		}
		if(($("#oob_dtmf").val() == 1) && (parseInt($("#dtms_events").val()) > 101 || parseInt($("#dtms_events").val()) < 97 || !$("#dtms_events").val().length))
		{	
			alert(WebString.dtmf_payload);
			return false;
		}
		XDoSubmit();
	});
	
});

//]]>
</script>
<script type="text/javascript">
//<![CDATA[

var web_timeout = 0;

function WebResetTimer()
{
	$.get("resettm.html");
	clearTimeout(web_timeout);
	web_timeout = setTimeout("XLogout();", top.XWebTimeout*1000);
}

function XLogout()
{
	$.post("/GponForm/LogoutForm","logout",function(){
        top.window.location.href = "logout.html";
	});	
}

function InitForm(page)
{
	$("#XWebPageName").val(page);
	$("#XForm").attr("action", "/GponForm/" + page + "_XForm");
}

function XDoSubmit()
{
	WebDoSubmit();
}

$(function () {
	if (window.top == window.self) {
		window.top.location.href = "index.html";
		return;
	}	 
	
	web_timeout = setTimeout("XLogout();", top.XWebTimeout*1000);
	InitForm(top.CurSubMenu);
	WebCreatMenu();
	WebLoadString();
	WebInit();
	$("input:password").attr("autocomplete","off");
	
	$("#btn_logout").click(function(){
	    $.post("/GponForm/LogoutForm","logout",function(){
            top.window.location.href = "logout.html";
	    });
	});
	
});

	window.history.forward(1);

//]]>
</script>
