<script type="text/javascript">
//<![CDATA[

var sys_log = [];
var write_level = 4;
var read_level = 4;

write_level="4"; 
read_level="4"; 
sys_log[0] = { log_Date: "2022-06-30", log_time: "10:57:01", log_level: 0, log_system: "Emergency", log_data: "disable rogue ont detecting" };
sys_log[1] = { log_Date: "2022-06-30", log_time: "10:57:01", log_level: 0, log_system: "Emergency", log_data: "disable rogue ont detecting" };


function freshlog()
{
	$.each(sys_log,function(wid,wel){
		$("#sys_log").append("<tr><td width='15%'>" + wel.log_Date + "</td><td width='13%'>"  + wel.log_time + "</td><td width='18%'>" + log_level[wel.log_level] + "</td><td width='20%'>" + wel.log_system + "</td><td width='34%'>" + wel.log_data + "</td></tr>");
	});
	if(sys_log.length > 8)
		$("#div_log").height(400);
}

function WebDoSubmit()
{
	$("#XForm").submit();
}

function WebInit()
{
	if(write_level < 8)
		$("#write_level").val(write_level);
	if(read_level < 8)
		$("#read_level").val(read_level);

	freshlog();
	WebStepIndex();
}

$(document).ready(function () {
	$("#btn_log").click(function(){
		XDoSubmit();
	});
});

//]]>
</script>
<script type="text/javascript">
//<![CDATA[

var web_timeout = 0;

function WebResetTimer()
{
	$.get("resettm.html");
	clearTimeout(web_timeout);
	web_timeout = setTimeout("XLogout();", top.XWebTimeout*1000);
}

function XLogout()
{
	$.post("/GponForm/LogoutForm","logout",function(){
        top.window.location.href = "logout.html";
	});	
}

function InitForm(page)
{
	$("#XWebPageName").val(page);
	$("#XForm").attr("action", "/GponForm/" + page + "_XForm");
}

function XDoSubmit()
{
	WebDoSubmit();
}

$(function () {
	if (window.top == window.self) {
		window.top.location.href = "index.html";
		return;
	}	 
	
	web_timeout = setTimeout("XLogout();", top.XWebTimeout*1000);
	InitForm(top.CurSubMenu);
	WebCreatMenu();
	WebLoadString();
	WebInit();
	$("input:password").attr("autocomplete","off");
	
	$("#btn_logout").click(function(){
	    $.post("/GponForm/LogoutForm","logout",function(){
            top.window.location.href = "logout.html";
	    });
	});
	
});

	window.history.forward(1);

//]]>
</script>
