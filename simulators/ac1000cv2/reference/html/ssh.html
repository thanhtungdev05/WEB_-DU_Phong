<script type="text/javascript">
//<![CDATA[

var local_enable = 0;
var remote_enable = 0;
var username = "";
var keepalive = 0;
var password = "";

var wan_list = new Array();

local_enable = 0;
remote_enable = 0;
wanindex = 0;
username = "";
password = "08ypih%&*%^#T()#$&E%SUCG6uy$E&";
keepalive = 0;

wan_list[0] = { index:" 0", name: "1_INTERNET_TR069_IPTV_R_VID_0" };


function DataInit()
{
    if (1 == local_enable)
        $("#local_enable").attr("checked", true);
    else
        $("#local_disable").attr("checked", true);

    if (1 == remote_enable)
        $("#rmt_enable").attr("checked", true);
    else
        $("#rmt_disable").attr("checked", true);
        
    var i;
    if(0 == wan_list.length)
    {
        $("#wan_list").append("<option value=\"no_wan\">" + "NO_WAN_Connection" + "</option>");
    }
    else
    {
        for (i = 0; i < wan_list.length; i++)
        {
           $("#wan_list").append("<option value=\"" + parseInt(wan_list[i].index) + "\">" + wan_list[i].name + "</option>");
        }
        $("#wan_list").attr("value", wanindex);
    }

    $("#username").val(username);
    $("#password1").val(password);
    $("#password2").val(password);
   
    if(0 < keepalive)
    {
        $("#idle_enable").attr("checked", true);
        $("#keepalive").val(keepalive);
        $("#timeoutset_div").show();
    }
    else
    {
        $("#idle_disable").attr("checked", true);
        $("#timeoutset_div").hide();
    }
}

function WebInit()
{    
    DataInit();
    RemoteSshEnable();
    WebStepIndex(); 
}

function RemoteSshEnable()
{
    var rmt_val=$('input:radio[name="remote_ssh"]:checked').val();
    var lcl_val = $('input:radio[name="local_ssh"]:checked').val();
    
    if(1 == rmt_val)
    {
        $("#wanlist_div").show();
    }
    else
    {
        $("#wanlist_div").hide();
    }
    
    if((1 == rmt_val) || (1 == lcl_val))
    {
        $("#username_div").show();
        $("#idletime_div").show();
    }
    else
    {
        $("#username_div").hide();
        $("#idletime_div").hide();       
    }

    WebStepIndex(); 
}

function IdleDisconnectEnable()
{
    var val=$('input:radio[name="idle_disconnect"]:checked').val();
    if(1 == val)
    {
        $("#timeoutset_div").show();
        $("#keepalive").val("300");
    }
    else
    {
        $("#timeoutset_div").hide();
        $("#keepalive").val("0");
    }
}

$(document).ready(function (){
	$("input").css("ime-mode","disabled");
    $("#btn_apply").click(function(){
        XDoSubmit();
    });  

    $("input[name='local_ssh']").click(function() {
        RemoteSshEnable();
    });

    $("input[name='remote_ssh']").click(function() {
        RemoteSshEnable();
    });

    $("input[name='idle_disconnect']").click(function() {
        IdleDisconnectEnable();
    });
});

function CheckSetValue()
{
    var username = $("#username").val();
    var password1 = $("#password1").val();
    var password2 = $("#password2").val();
    var keepalive = $("#keepalive").val();
    var rmt_val = $('input:radio[name="remote_ssh"]:checked').val();
    var lcl_val = $('input:radio[name="local_ssh"]:checked').val();
    var val=$('input:radio[name="idle_disconnect"]:checked').val();

    if((1 == rmt_val) || (1 == lcl_val))
    {
        if (false == isValidUsername1(username)) 
        {
            alert(WebString.valid_username);
            $("#username").focus();
            return false;
        }

        if(username.length < 1 || username.length > 25)
        {
            alert(WebString.ssh_username_length);
            $("#username").focus();
            return false;
        }

        if(password1.length < 1 || password1.length > 64)
        {
            alert(WebString.valid_sshpwd_length);
            $("#password1").focus();
            return false;
        }

        if(password1 != password2)
        {
            alert(WebString.password_differ);
            $("#password2").focus();
            return false;
        }

        if(1 == val)
        {
            if(false == IsNum(keepalive) || parseInt(keepalive) > 86400 || parseInt(keepalive) < 60)
            {
                alert(XsshString[11]);
                return false;
            }
        }
    }
    if( 1 == rmt_val)
    {
        if("no_wan" == $("#wan_list").val())
        {
            alert(WebString.no_valid_wan);
            $("#wan_list").focus();
            return false;	
        }
    }
           
    return true;
}

function WebDoSubmit()
{   
    if( false == CheckSetValue())
    {
        return;
    }
    $("#XForm").submit();
}

//]]>
</script>

        top.window.location.href = "logout.html";
	});	
}

function InitForm(page)
{
	$("#XWebPageName").val(page);

}

function XDoSubmit()

}

$(function () {

});

	window.history.forward(1);
