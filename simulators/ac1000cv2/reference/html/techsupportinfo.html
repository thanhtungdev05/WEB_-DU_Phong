<script type="text/javascript">
//<![CDATA[

var COLLECT_ALLLOG_NONE = 0;
var COLLECT_ALLLOG_REQUESTED = 1;
var COLLECT_ALLLOG_COMPLETE = 2;
var COLLECT_ALLLOG_FILEEXIST = 3;

var collect_alllog_state = 0;
var save_file = "";
var applyType = 0;

collect_alllog_state="0";


function WebDoSubmit()
{
    if (1 == $("#applyType").val())
    {
		if(1 == top.collect_alllog_btn_flag)
		{
			alert(WebString.collect_alllog_alert);
			return;
		}

		$("#btn_Collect").removeClass("btn").addClass("btn_gray");
		$("#btn_Download").removeClass("btn").addClass("btn_gray");		
		top.collect_alllog_btn_flag = 1;
    	$("#XForm").submit();
    }
}

function WebInit()
{
	WebStepIndex();

	if (COLLECT_ALLLOG_REQUESTED == collect_alllog_state)
	{
		$("#btn_Collect").removeClass("btn").addClass("btn_gray");
		$("#btn_Download").removeClass("btn").addClass("btn_gray");

		//$("#btn_Collect").attr("disabled",true);
		//$("#btn_Download").attr("disabled",true);
		setTimeout(function(){window.location.href = window.location.href;}, 5000);
	}
	else if((COLLECT_ALLLOG_COMPLETE == collect_alllog_state) || (COLLECT_ALLLOG_FILEEXIST == collect_alllog_state))
	{
		$("#btn_Collect").removeClass("btn_gray").addClass("btn");
		$("#btn_Download").removeClass("btn_gray").addClass("btn");		

		//$("#btn_Collect").attr("disabled",false);
		//$("#btn_Download").attr("disabled",false);
		top.collect_alllog_btn_flag = 0;

	}
	else
	{
		//$("#btn_Collect").attr("disabled",false);
		//$("#btn_Download").attr("disabled",true);
		$("#btn_Collect").removeClass("btn_gray").addClass("btn");
    	$("#btn_Download").removeClass("btn").addClass("btn_gray");		
	}
}

$(document).ready(function () {
	$("#btn_Collect").click(function(){
	    $("#applyType").val('1');
		XDoSubmit();
	});

	$("#btn_Download").click(function() {
    	if(1 != top.collect_alllog_btn_flag)
	    {
	        if(save_file == "") {
	            alert(XtechsupportinfoString[1]);
	        }else {
	            window.location.href = save_file;
	        }
	    }
	});
	
});

//]]>
</script>
<script type="text/javascript">
//<![CDATA[

var web_timeout = 0;

function WebResetTimer()
{
	$.get("resettm.html");
	clearTimeout(web_timeout);
	web_timeout = setTimeout("XLogout();", top.XWebTimeout*1000);
}

function XLogout()
{
	$.post("/GponForm/LogoutForm","logout",function(){
        top.window.location.href = "logout.html";
	});	
}

function InitForm(page)
{
	$("#XWebPageName").val(page);
	$("#XForm").attr("action", "/GponForm/" + page + "_XForm");
}

function XDoSubmit()
{
	WebDoSubmit();
}

$(function () {
	if (window.top == window.self) {
		window.top.location.href = "index.html";
		return;
	}	 
	
	web_timeout = setTimeout("XLogout();", top.XWebTimeout*1000);
	InitForm(top.CurSubMenu);
	WebCreatMenu();
	WebLoadString();
	WebInit();
	$("input:password").attr("autocomplete","off");
	
	$("#btn_logout").click(function(){
	    $.post("/GponForm/LogoutForm","logout",function(){
            top.window.location.href = "logout.html";
	    });
	});
	
});

	window.history.forward(1);

//]]>
</script>

	<div id="header">

		<div id="header_right">
			<table><tr><td><h2 id="device_name"></h2>
			<a href="#" class="btn" id="btn_logout"><script type="text/javascript">document.write(WebString.Logout);</script></a></td></tr></table>
		</div>
		<ul id="main_menu">
		</ul>
	</div>
	<div id="content_left">
		<ul id="sub_menu">
		</ul>
	</div>
	<div id="content_right">
		<h1 id="content_title"></h1>
		<div id="cfgarea">


<div class="cfgstep">
	<p><strong id="XS0"></strong></p>
	<table>
		<tr>
			<td><a id="btn_Collect" class="btn apply_btn" href="#"><script>document.write(WebString.Collect);</script></a></td>
            <td><a id="btn_Download" class="btn apply_btn" href="#"><script>document.write(WebString.Download);</script></a></td>
		</tr>
	</table>
</div>

<div class="cfgstep" style="display:none">
	<table>
		<tr>
			<td><input type="text" name="applyType" id="applyType" maxlength="4" size="6" style="ime-mode: disabled;" value="0" onkeypress="return OnKeyPress(event, X_INPUT_NUM);" /></td>
		</tr>
	</table>
</div>

		</div>
	</div>

</div>
