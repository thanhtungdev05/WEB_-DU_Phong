<script type="text/javascript">
//<![CDATA[

var username = new Array();
var user_pri = 0;

old_password = "admin";
user_pri = 1;
username = ["admin", ""];
var currentuserid = 3;


function showUserList()
{
	var i, str = "";
	for (i = 0; i< username.length; i++)
	{
		if (0 == username[i].length) continue;
		str += '<option value="' + username[i] + '">' + username[i] + '<\/option>';
	}
	$("#userlist").html(str);
}

function doUserList()
{
	$("#username").val($("#userlist").val());
}

function WebInit()
{
	if (("em" == top.WebProject) && (4 == top.XCurrentUser))
	{
		$("#userlist").show();
		$("#username").hide();
		showUserList();
	}
    $("#username").attr("readonly","true");
	if (3 == currentuserid)
	    $("#username").val(username[0]);
	else
    	$("#username").val(username[currentuserid]);
    
    WebStepIndex(); 
}

$(document).ready(function (){
	$("#userlist").change(function(){
		doUserList();
	});
    $("#btn_apply").click(function(){
        XDoSubmit();
    });   
});

function CheckSetValue()
{
    var username = $("#username").val();
	var password0 = $("#password0").val();
    var password1 = $("#password1").val();
    var password2 = $("#password2").val();
	
    /*if(username.length < 6)
    {
        alert(WebString.username_length);
        $("#username").focus();
        return false;
    }*/

	if(password0 != old_password)
	{
		alert(WebString.password_username);
		$("#password0").focus();
		return false;
	}
    if(password1.length < 6 || password1.length > 64)
    {
        alert(WebString.valid_passwd_length);
        $("#password1").focus();
        return false;
    }

    if(password1 != password2)
    {
        alert(WebString.password_differ);
        $("#password2").focus();
        return false;
    }

    return true;
}

function WebDoSubmit()
{       
    if( false == CheckSetValue())
    {
        return;
    }
    $("#XForm").submit();
}

//]]>
</script>
<script type="text/javascript">
//<![CDATA[

var web_timeout = 0;

function WebResetTimer()
{
	$.get("resettm.html");
	clearTimeout(web_timeout);
	web_timeout = setTimeout("XLogout();", top.XWebTimeout*1000);
}

function XLogout()
{
	$.post("/GponForm/LogoutForm","logout",function(){
        top.window.location.href = "logout.html";
	});	
}

function InitForm(page)
{
	$("#XWebPageName").val(page);
	$("#XForm").attr("action", "/GponForm/" + page + "_XForm");
}

function XDoSubmit()
{
	WebDoSubmit();
}

$(function () {
	if (window.top == window.self) {
		window.top.location.href = "index.html";
		return;
	}	 
	
	web_timeout = setTimeout("XLogout();", top.XWebTimeout*1000);
	InitForm(top.CurSubMenu);
	WebCreatMenu();
	WebLoadString();
	WebInit();
	$("input:password").attr("autocomplete","off");
	
	$("#btn_logout").click(function(){
	    $.post("/GponForm/LogoutForm","logout",function(){
            top.window.location.href = "logout.html";
	    });
	});
	
});

	window.history.forward(1);

//]]>
</script>
