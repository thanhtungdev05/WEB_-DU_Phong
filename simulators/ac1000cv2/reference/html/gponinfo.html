<script type="text/javascript">
//<![CDATA[

var ponStaIndex=0;
var current="0";
var voltage="0";
var temperature="0";
var rxpower="0";
var hidden=0;
var txpower="0";
var txpkts=0;
var rxpkts=0;
var txDropped=0;
var rxDropped=0;
var txErrs=0;
var rxpower_temp=0;
var txpower_value=0;

hidden = 0;
current="7150";
voltage="165";
temperature="8448";
rxpower="14500";
txpower="14500";

ponStaIndex = 1;
rxfecEnable = 0;
txfecEnable = 0;
txpkts = 0;
rxpkts = 0;
txDropped = 0;
rxDropped = 0;
txErrs = 0;


function WebInit()
{	
	if (top.WebProject != "hw")
	{
		$("#gpon_txpower").show();
		$("#gpon_rxpower").show();
		$("#gpon_temperature").show();
		$("#gpon_voltage").show();
		$("#gpon_current").show();
	}

	$("#ponSta").html("O" + ponStaIndex + " - " + WebString.gpon_state[ponStaIndex-1]);
	txpower_value=((parseInt(txpower)/500)-30).toFixed(2);
	if (txpower_value == -1)
	{
		$("#txpower").html("No output");
	}
	else 
	{	
		$("#txpower").html(((parseInt(txpower)/500)-30).toFixed(2) + " dBm");
	}	
	if (ponStaIndex == 1)
	{
		$("#rxpower").html(WebString.no_optical_input);	
	}
	else 
	{
		$("#rxpower").html(((parseInt(rxpower)/500)-30).toFixed(2) + " dBm");	
	}	
	$("#temperature").html((parseInt(temperature/256)) + " ℃");		
	$("#voltage").html((parseInt(voltage)/50).toFixed(2) + " V");
	$("#current").html((parseInt(current)/500).toFixed(2) + " mA");
	$("#txpkts").html(txpkts);
	$("#rxpkts").html(rxpkts);
	rxpower_temp=((parseInt(rxpower)/500)-30).toFixed(2); 
	if(!hidden && (rxpower_temp < -27 || rxpower_temp > -8))
	{	
	$("#warning").html("Warning：The optical signal is out of range!!!");
	$("#warning").css("color","#F00");	
	}
}

function WebDoSubmit()
{
}

//]]>
</script>
<script type="text/javascript">
//<![CDATA[

var web_timeout = 0;

function WebResetTimer()
{
	$.get("resettm.html");
	clearTimeout(web_timeout);
	web_timeout = setTimeout("XLogout();", top.XWebTimeout*1000);
}

function XLogout()
{
	$.post("/GponForm/LogoutForm","logout",function(){
        top.window.location.href = "logout.html";
	});	
}

function InitForm(page)
{
	$("#XWebPageName").val(page);
	$("#XForm").attr("action", "/GponForm/" + page + "_XForm");
}

function XDoSubmit()
{
	WebDoSubmit();
}

$(function () {
	if (window.top == window.self) {
		window.top.location.href = "index.html";
		return;
	}	 
	
	web_timeout = setTimeout("XLogout();", top.XWebTimeout*1000);
	InitForm(top.CurSubMenu);
	WebCreatMenu();
	WebLoadString();
	WebInit();
	$("input:password").attr("autocomplete","off");
	
	$("#btn_logout").click(function(){
	    $.post("/GponForm/LogoutForm","logout",function(){
            top.window.location.href = "logout.html";
	    });
	});
	
});

	window.history.forward(1);

//]]>
</script>

</div>
