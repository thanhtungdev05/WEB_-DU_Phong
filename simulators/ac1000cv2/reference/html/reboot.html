<script type="text/javascript">
//<![CDATA[

var values = "";
var i = 0;

function updateProcess()
{
	if(i < 99)
	{
		i = i + 1;
		values =  WebString.rebooting + i + "%";
		document.getElementById('myProcess').innerHTML = values;
	}
	else
	{
		window.location.href = window.location.href;
	}
}

function WebDoSubmit()
{
	if(!confirm(WebString.reboot_confirm))
	{
		return;
	}
	
	top.reboot_flag = 1;
	$("#div_rebooting").show();
	$("#div_init").hide();
	$("#XForm").submit();
}

function WebInit()
{
	if(1 == top.reboot_flag)
	{
		setInterval("updateProcess();", 1000);
		$("#div_rebooting").show();
		$("#div_init").hide();
	}
	else
	{
		$("#div_rebooting").hide();
		$("#div_init").show();
	}

	//WebStepIndex();
}

$(document).ready(function () {
	$("#btn_reboot").click(function(){
		XDoSubmit();
	});
});

//]]>
</script>
<script type="text/javascript">
//<![CDATA[

var web_timeout = 0;

function WebResetTimer()
{
	$.get("resettm.html");
	clearTimeout(web_timeout);
	web_timeout = setTimeout("XLogout();", top.XWebTimeout*1000);
}

function XLogout()
{
	$.post("/GponForm/LogoutForm","logout",function(){
        top.window.location.href = "logout.html";
	});	
}

function InitForm(page)
{
	$("#XWebPageName").val(page);
	$("#XForm").attr("action", "/GponForm/" + page + "_XForm");
}

function XDoSubmit()
{
	WebDoSubmit();
}

$(function () {
	if (window.top == window.self) {
		window.top.location.href = "index.html";
		return;
	}	 
	
	web_timeout = setTimeout("XLogout();", top.XWebTimeout*1000);
	InitForm(top.CurSubMenu);
	WebCreatMenu();
	WebLoadString();
	WebInit();
	$("input:password").attr("autocomplete","off");
	
	$("#btn_logout").click(function(){
	    $.post("/GponForm/LogoutForm","logout",function(){
            top.window.location.href = "logout.html";
	    });
	});
	
});

	window.history.forward(1);

//]]>
</script>

		</div>
		<ul id="main_menu">
		</ul>
	</div>
	<div id="content_left">

	</div>

<div id="div_init">
	<div class="cfgstep">

		<a id="btn_reboot" class="btn apply_btn" href="#"><script>document.write(WebString.Reboot);</script></a>
	</div>
</div>

<div id="div_rebooting">

</div>
