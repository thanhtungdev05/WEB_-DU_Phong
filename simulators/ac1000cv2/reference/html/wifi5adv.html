<script type="text/javascript">

var aggre_mode="";
var threshold="";
var dtm="";
var protection="";
var beacon_interval="";
var multicast="";
var guardInterval="";

aggre_mode=0;
threshold=0;
dtm=1;
beacon_interval=100;
protection=0;
multicast=1;
guardInterval=0;
wifi_mode=0;
isRG3T=0;


function WebInit()
{
	if (top.WebProject != "hw")
	{
		$("#wifi_multicast").show();
		$("#wifi_shortguard").show();
	}
	else
	{
		$("#wifi_shortguard").show();
	}
	
	$("#aggre_mode").val(aggre_mode);
    $("#threshold").val(threshold);
    $("#dtm").val(dtm);  
    
    if (protection == '1')
    {
		$("#802_11_mannual").show();   
		$("#802_11_mode").val(3);   	
		$("#protection_bg_on").attr("checked", true);
	}	
	else if(protection == '0')
	{	
		$("#802_11_mannual").show();	
		$("#802_11_mode").val(3);   	
		$("#protection_bg_off").attr("checked", true);  
	}	
	else if(protection == '2')
	{
		$("#802_11_mode").val(2);
		$("#802_11_mannual").hide();
	}	
	
	$("#beacon_interval").val(beacon_interval);
	
    if (multicast == '1')
		$("#multicast_on").attr("checked", true);
	else
		$("#multicast_off").attr("checked", true); 	
		
	if (guardInterval == '1')
		$("#shortguard_on").attr("checked", true);
	else
		$("#shortguard_off").attr("checked", true); 		
    
	WebStepIndex();
}

function WebDoSubmit()
{
	var threshold = $("#threshold").val();
	if(threshold > 2347 || threshold < 0)
	{
		alert(Xwifi5advString[19]);
		return false;	
	}

	var dtm = $("#dtm").val();
	if(dtm > 255 || dtm < 1)
	{
		alert(Xwifi5advString[20]);
		return false;	
	}

	$("#XForm").submit();
}

function WebDoRestore()
{
    if (!confirm(WebString.config_restore))
    {
        return;
    }
	
    //the following values are the same as XML
    $("#aggre_mode").val(0);
    $("#threshold").val(0);
    $("#dtm").val(1);
    $("#802_11_mode").val(3);
    $("#protection_bg_off").attr("checked", true); 	
    $("#beacon_interval").val(100);
    $("#multicast_on").attr("checked", true);
    $("#shortguard_off").attr("checked", true); 
    $("#XForm").submit();
}

$(document).ready(function () {
	$("input").css("ime-mode","disabled");
	$("#btn_apply").click(function() {
		WebDoSubmit();
	});
	
	$("#btn_store").click(function() {
		WebDoRestore();
	});
	
});

function SelectProtectionMode(mode)
{
	if (mode == 2)
	{
		$("#802_11_mannual").hide();		
	
	}
	else if(mode == 3)
	{
		$("#802_11_mannual").show();	
	}

}


</script>
<script type="text/javascript">
//<![CDATA[

var web_timeout = 0;

function WebResetTimer()
{
	$.get("resettm.html");
	clearTimeout(web_timeout);
	web_timeout = setTimeout("XLogout();", top.XWebTimeout*1000);
}

function XLogout()
{
	$.post("/GponForm/LogoutForm","logout",function(){
        top.window.location.href = "logout.html";
	});	
}

function InitForm(page)
{
	$("#XWebPageName").val(page);
	$("#XForm").attr("action", "/GponForm/" + page + "_XForm");
}

function XDoSubmit()
{
	WebDoSubmit();
}

$(function () {
	if (window.top == window.self) {
		window.top.location.href = "index.html";
		return;
	}	 
	
	web_timeout = setTimeout("XLogout();", top.XWebTimeout*1000);
	InitForm(top.CurSubMenu);
	WebCreatMenu();
	WebLoadString();
	WebInit();
	$("input:password").attr("autocomplete","off");
	
	$("#btn_logout").click(function(){
	    $.post("/GponForm/LogoutForm","logout",function(){
            top.window.location.href = "logout.html";
	    });
	});
	
});

	window.history.forward(1);

//]]>
</script>
