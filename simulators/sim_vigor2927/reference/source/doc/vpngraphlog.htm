"L2TPIPSEC","SSLTUNNEL","OPENVPN","WireGuard"];var AUTH_TYPE=["LOCAL","RADIUS","LDAP"];var EVENT_TYPE=["UP","DOWN"];var isSelect=[true,true];var REALNOW_date=new Date(); var REALUP_sec=REALNOW_date.getTime()/1000-current_up;var arytype_prof=new Array(); for(var i=0;i<2;i++)arytype_prof[i]=new Array();var aryProf=new Array();iniCtrlVal();initWebChange();function onChgAccMod(tab){if(tab==1){document.location="/cgi-bin/v2x00.cgi?sFormAuthStr=JdvKVyYlhh7GhS9&fid=2129&pageap=1";}else{document.location="/cgi-bin/v2x00.cgi?sFormAuthStr=JdvKVyYlhh7GhS9&fid=2129";}}function collectProf(pname){for(var i=0;i<aryProf.length;i++){if(aryProf[i]==pname)return;}aryProf.push(pname);}function collectType(ptype,pname){if(ptype-1<0)return;for(var i=0;i<arytype_prof[ptype-1].length;i++){if(arytype_prof[ptype-1][i]==pname)return;}arytype_prof[ptype-1].push(pname);}function iniCtrlVal(){var tmp="";var lastDate=new Date();var aryLog;for(i=0;i<aryVPNGraphLogs.length;i++){aryLog=aryVPNGraphLogs[i];collectProf(aryLog[7]);collectType(aryLog[2],aryLog[7]);} for(i=0;i<arytype_prof.length;i++){arytype_prof[i].sort();}for(i=0;i<arytype_prof.length;i++){var obj=document.getElementById("proftype"+i);var opt_offset=0;if(i!=proftype){obj.options[0]=new Option(" ----- ","");opt_offset=1;}for(j=0;j<arytype_prof[i].length;j++){obj.options[j+opt_offset]=new Option((j+1)+". "+arytype_prof[i][j],arytype_prof[i][j]);}}var obj=document.getElementById("proftype"+proftype);if(proftype=="0"&&obj.options.length==0){var obj1=document.getElementById("proftype1");if(obj1.options.length>0){proftype=1;obj=obj1;}}bg.setVle2Elmt(f.iProfType,proftype,0);document.getElementById("proftype"+proftype).style.display="";if(sProf!=""){for(i=0;i<obj.options.length;i++){if(obj.options[i].value==sProf)obj.selectedIndex=i;}}else{if(obj.options.length>0)sProf=obj.options[0].value;}aryVPNGraphLogs.forEach(function(log){if(log[2]-1==proftype&&log[7]==sProf){lastDate.setTime((REALUP_sec+log[0])*1000);var str=formatDate(lastDate,"yyyy-MM-dd HH:mm:ss")+" ["+VPN_TYPE[log[1]]+"]["+PROF_TYPE[log[2]-1]+"]["+AUTH_TYPE[log[3]-1]+"][@Index: "+(log[6]==0?"NONE":log[6])+"][Name: "+log[7]+"]["+(log[9]?'from':'To')+" "+log[5]+"]["+EVENT_TYPE[log[4]-1]+"]"+log[8];tmp+=str+"\n";}});f.txtLog.value=tmp;}function RefreshLog(iProfType){var selectObj=document.getElementById("proftype"+iProfType);var option=selectObj.options[selectObj.selectedIndex];if(option.value=="")return;bg.setVle2Elmt(f.iProfType[0],iProfType);bg.setVle2Elmt(f.sProf,option.value,0);bg.cpntCtrl(false,f,f.txtLog,1);f.submit();}function selProf(obj,iProfType){var strUA=navigator.userAgent.toUpperCase();var isSafari=(strUA.indexOf("SAFARI")!==-1&&strUA.indexOf("CHROME")==-1)?true:false;var isLinuxC=(strUA.indexOf("LINUX")!==-1&&(strUA.indexOf("CHROME")!==-1||strUA.indexOf("CHROMIUM")!==-1))?true:false;if(isSafari||isLinuxC){RefreshLog(iProfType);return;}var selectedOption=obj.options[obj.selectedIndex];if(obj.value==selectedOption.value)isSelect[iProfType]=!isSelect[iProfType];else isSelect[iProfType]=true;if(isSelect[iProfType])RefreshLog(iProfType);}function changetype(itype){document.getElementById("proftype0").style.display="none";document.getElementById("proftype1").style.display="none";document.getElementById("proftype"+itype).style.display="";}</script></body></html>
