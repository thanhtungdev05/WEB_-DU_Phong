p.ACTION_STATUS=-1;top.iActionStatusFlag='0';top.iFwUpgradeState='0';top.act_sta.damage_alert();var f=document.frm1;var bg=parent;var bs_enable=parseInt("0");var client_num=parseInt("15");var min_rssi=parseInt("78");var min_rssi_enable=parseInt("0");var dr_signal_percent_tab=['0','2','5','7','10','13','15','18','20','23','24','26','29','31','34','37','39','42','44','47','50','52','55','57','60','63','65','68','70','73','76','78','81','83','86','89','91','94','96','99','100'];initParameter();initWebChange();function initParameter(){f.bs_enable.checked=bs_enable?1:0;f.min_rssi_enable.checked=min_rssi_enable?1:0;bg.setVle2Elmt(f.client_num,client_num,0);bg.setVle2Elmt(f.min_rssi,min_rssi,0);f.rSignalPercent.disabled=true;changeSignal();}function changeSignal(){var signal,x;var e;var str="---";signal=bg.getVleFromElmt(f.min_rssi,0);e=document.getElementById("rSignalPercent");if(isAllNum(signal)&&signal>=1){if(signal<=90){x=90-signal;if(x>=0&&x<=40)str=dr_signal_percent_tab[x];else str="100";}else{str="0";}}bg.setVle2Elmt(e,str,0);}function checkOK(){if(!parseInt('1')){submitParameter();return;}$http.get("/wifigoing.cgi?sFormAuthStr=ZChZ65B1x7oWVPs&page=0").then(function(data){if(data.data=="1"){ alert(gettext('Wireless is initiating.')+"\n"+gettext("Cannot change setting."));}else submitParameter();},function(err){alert(gettext("Failed!"));return;});}function submitParameter(){client_num=bg.getVleFromElmt(f.client_num);if(client_num<1||client_num>60){alert(gettext("Check time must be between ###MIN### and ###MAX###!").replace("###MIN###",1).replace("###MAX###",60));return;}min_rssi=bg.getVleFromElmt(f.min_rssi);if(min_rssi<0||min_rssi>100){alert(gettext("Minimum RSSI must be between ###MIN### and ###MAX###!").replace("###MIN###",0).replace("###MAX###",100));return;}if(checkWebChange()){f.webchange.value='1';}f.submit();}function noteShow(){window.open('/doc/wlband_note.htm','Band Steering','toolbars=no,width=800,height=200px,top=150px,left='+(screen.width/2-230)+'px,status=no,menubar=no');}function enable_check(){f.min_rssi_enable.disabled=!f.bs_enable.checked;}function isAllNum(str){for(var i=0;i<str.length;i++){if((str.charAt(i)>='0'&&str.charAt(i)<='9')||(str.charAt(i)=='.'))continue;return 0;}return 1;}</script></body></html>
