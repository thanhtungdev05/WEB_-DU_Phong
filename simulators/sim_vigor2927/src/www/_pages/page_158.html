<!DOCTYPE html><html ng-app=myApp ng-controller=TranslateCtrl><head><script src="/js/gettext.min.js?094907"></script><meta / charset=UTF-8><link href="/style.min.css?094907" rel=stylesheet type=text/css><script src="/js/webchange.js?094907"></script></head><body class=ng-cloak><table align=center border=0 cellpadding=0 cellspacing=0 width=700><tr><td><b parent="Wireless LAN (2.4 GHz)" sub-title translate>Roaming</b><hr><form action=/cgi-bin/v2x00.cgi method=POST name=frm1><b translate>Router-assisted Client Roaming Parameters</b><table align=center border=1 cellpadding=0 cellspacing=0 width=100%><tr><td><table align=center border=0 cellpadding=2 cellspacing=2 width=100%><tr><td colspan=2><input checked name=roamType type=radio value=0><span id="rTypeDisableTxt" translate>Disable RSSI Requirement</span></td></tr><tr><td width=40%><input name=roamType type=radio value=1> <a href=# onclick=noteShow(4);><span id="rTypeStickyTxt" translate>Strictly Minimum RSSI</span></a></td><td>-<input id=roamSignal maxlength=2 name=roamSignal onchange=changeSignal(1); size=4>&nbsp;dBm (<input id=rSignalPercent name=rSignalPercent size=3 value=--->%) <span id="rSignalDftTxt">(Default: -73)</span></td></tr><tr><td><input name=roamType type=radio value=2> <a href=# onclick=noteShow(5);><span id="rTypeSecureTxt" translate>Minimum RSSI</span></a></td><td>-<input id=roamSignalSec maxlength=2 name=roamSignalSec onchange=changeSignal(2); size=4>&nbsp;dBm (<input id=rSignalPercentSec name=rSignalPercentSec size=3 value=--->%) <span id="rSignalSecDftTxt">(Default: -66)</span></td></tr><tr><td> &nbsp; &nbsp; &nbsp; &nbsp; <span id="rDeltaTxt" translate>with Adjacent AP RSSI over</span></td><td><input id=roamDelta maxlength=2 name=roamDelta size=4> dB <span id="rDeltaDftTxt">(Default: 5)</span></td></tr></table></td></tr></table><br><div id=en_auto_prov style=display:none><input name=enAutoProv type=checkbox value=1>&nbsp;Enable VigorAP AutoProvision for these settings<br><br></div><table align=center border=0><tr><td><input class=btnw name=btnOk onclick=checkOK() type=button value="OK"> &nbsp; &nbsp; <input class=btnw id=afCancel onClick=window.location.reload() type=reset value="Cancel"></td></tr></table><input name=fid type=hidden value=2151><input name=iAct type=hidden value=1><input name=webchange type=hidden value=0><input name=sFormAuthStr type=hidden value="ZChZ65B1x7oWVPs"></form></table><script src="/js/variable.js?1079"></script><script> top.ACTION_STATUS=-1;top.iActionStatusFlag='0';top.iFwUpgradeState='0';top.act_sta.damage_alert();var f=document.frm1;var bg=parent;var sysdashtxt='##% Mode : Disable##%  rs_low          : -73 ##%  rs_low_secure   : -66 ##%  delta           : 5  ';var dr_signal_percent_tab=['0','2','5','7','10','13','15','18','20','23','24','26','29','31','34','37','39','42','44','47','50','52','55','57','60','63','65','68','70','73','76','78','81','83','86','89','91','94','96','99','100'];var iApmFlags="(nil)";var iApmApplyLocWlan="0";initParameter();initWebChange();function initParameter(){var arySysdash=sysdashtxt.split("%");var pos,resline,sName,sValue,len,i;var aryDashCtl=new Array();for(i=0;i<arySysdash.length;i++){len=arySysdash[i].length;if(len<6)continue;resline=arySysdash[i].replace(/\s/g,""); pos=resline.indexOf(":");sName=resline.substr(0,pos);sValue=resline.substr(pos+1,resline.length-pos-1);switch(sName){case"Mode":if(sValue=="StrictlyMinimunRSSI##")f.roamType[1].checked=true;else if(sValue=="MinimumRSSI##")f.roamType[2].checked=true;else f.roamType[0].checked=true;break;case"rs_low":if(sValue.substr(1,sValue.length-3)=="0")bg.setVle2Elmt(f.roamSignal,"73",0);else bg.setVle2Elmt(f.roamSignal,sValue.substr(1,sValue.length-3),0);break;case"rs_low_secure":if(sValue.substr(1,sValue.length-3)=="0")bg.setVle2Elmt(f.roamSignalSec,"66",0);else bg.setVle2Elmt(f.roamSignalSec,sValue.substr(1,sValue.length-3),0);break;case"delta":if(sValue=="0")sValue="5";bg.setVle2Elmt(f.roamDelta,sValue,0);break;}}if(iApmApplyLocWlan==1){bg.showElmtById(document,"en_auto_prov");}bg.setVle2Elmt(f.enAutoProv,!(iApmFlags&1),0);f.rSignalPercent.disabled=true;f.rSignalPercentSec.disabled=true;changeSignal(1);changeSignal(2);}function changeSignal(opt){var signal,x;var e;var str="---";if(opt==1){signal=bg.getVleFromElmt(f.roamSignal,0);e=document.getElementById("rSignalPercent");}else{signal=bg.getVleFromElmt(f.roamSignalSec,0);e=document.getElementById("rSignalPercentSec");}if(isAllNum(signal)&&signal>=1){if(signal<=90){x=90-signal;if(x>=0&&x<=40)str=dr_signal_percent_tab[x];else str="100";}else{str="0";}}bg.setVle2Elmt(e,str,0);}function checkOK(){if(!parseInt('1')){submitParameter();return;}$http.get("/wifigoing.cgi?sFormAuthStr=ZChZ65B1x7oWVPs&page=0").catch(function(response){alert(gettext("Failed!"));}).then(function(response){if(response.data==1){ alert(gettext("Wireless is initiating.")+"\n"+gettext("Cannot change setting."));}else submitParameter();});}function submitParameter(){ var signal,signal_sec,delta;signal=bg.getVleFromElmt(f.roamSignal,0);if(!isAllNum(signal)||signal<62||signal>86){alert(gettext("Strictly Minimum RSSI/Minimum RSSI should be between -86 dBm and -62 dBm."));return false;}signal_sec=bg.getVleFromElmt(f.roamSignalSec,0);if(!isAllNum(signal_sec)||signal_sec<62||signal_sec>86){alert(gettext("Strictly Minimum RSSI/Minimum RSSI should be between -86 dBm and -62 dBm."));return false;}delta=bg.getVleFromElmt(f.roamDelta,0);if(!isAllNum(delta)||delta<1||delta>20){alert(gettext("Adjacent AP RSSI should be between 1 dB and 20 dB"));return false;}if(checkWebChange()){f.webchange.value='1';}f.submit();}function isAllNum(str){for(var i=0;i<str.length;i++){if((str.charAt(i)>='0'&&str.charAt(i)<='9')||(str.charAt(i)=='.'))continue;return 0;}return 1;}function noteShow(flag){noteflag=flag;window.open('wlroamingnote.htm','roaming','toolbars=no,width=800,height=200px,top=150px,left='+(screen.width/2-230)+'px,status=no,menubar=no');}</script></body></html>
