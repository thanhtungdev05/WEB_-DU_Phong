</textarea><script> top.ACTION_STATUS=-1;top.iActionStatusFlag='0';top.iFwUpgradeState='0';top.act_sta.damage_alert();var bg=parent;var f=document.frm;var cloudvpn2initScript=document.createElement("script");cloudvpn2initScript.text=document.getElementById("cloudvpn2init").value;document.head.appendChild(cloudvpn2initScript);var pc_mac='[0,"","","","192.168.1.1","255.255.255.0","0.0.0.0","0.0.0.0"]';var iProfileIdx='0';angular.element(document).ready(function(){initWebChange();initPage();initParameter();});function initPage(){f.iL2LPrf.options[0]=new Option(bg.strFormat(gettext("[Index]"),8)+bg.strFormat(gettext("[Status]"),9)+gettext("[Name]"),-1);var oplen=1;for(var i=0;i<aryRmDialInPrf.length;i++){if(aryRmDialInPrf[i][0]=="v")continue;f.iL2LPrf.options[oplen]=new Option(bg.strFormat((i+1),8)+bg.strFormat(aryRmDialInPrf[i][0],9)+aryRmDialInPrf[i][1],i);oplen++;}angular.forEach(document.querySelectorAll("input[placeholder]"),function(self){self.placeholder=self.placeholder.replace("###LEN###",self.maxLength);});}function initParameter(){}function submitPara(){if(bg.getVleFromElmt(f.iL2LPrf)==-1){alert(gettext("Please specify VPN profile!"));return false;}if(bg.getVleFromElmt(f.sProfName)=="???"){alert(gettext("Username is Invalid !"));return false;}if(bg.getVleFromElmt(f.sProfPass)==""){alert(gettext("password cannot be null."));return false;}var CloudVPNList=window.localStorage.getItem("CloudVPNList");if(CloudVPNList)addProfileIdxtolist(JSON.parse(CloudVPNList));f.submit();}function onchgProf(){var idx=bg.getVleFromElmt(f.iL2LPrf);if(aryRmDialInPrf[idx][1]!="???")bg.setVle2Elmt(f.sProfName,aryRmDialInPrf[idx][1],0);else bg.setVle2Elmt(f.sProfName,"",0);}function addProfileIdxtolist(list){for(i=0;i<list.length;i++){if(pc_mac==list[i][1])list[i][5]=parseInt(bg.getVleFromElmt(f.iL2LPrf))+1;}var data=JSON.stringify(list);window.localStorage.setItem("CloudVPNList",data);}function onbtnCcl(){document.location="/cgi-bin/V2X00.cgi?sFormAuthStr=ZChZ65B1x7oWVPs&fid=2204&sAc
