ltPage.options.length=0;for(i=0;i<Math.ceil(arySet[8]/iPerPage);i++){iStart=i*iPerPage+1;iEnd=(i+1)*iPerPage;if(iEnd>arySet[8])iEnd=arySet[8];f.iSltPage.options[i]=new Option(iStart+"-"+iEnd,iStart-1);}if(tmp[1].length>0){var aryData=tmp[1].split(";");var str1="";for(i=0;i<aryData.length;i++){arytmp=aryData[i].split(",");str1+="<tr style='border-top:1px solid #000;'><td>"+arytmp[3]+"</td><td>"+arytmp[2]+"</td><td>";str1+=aryStatus[arytmp[0]]+"</td><td>"+arytmp[4]+"</td><td>"+arytmp[5];str1+="</td><td>"+arytmp[1]+"-"+aryQuato[arytmp[1]-1]+"</td><td>"+arytmp[6]+"</td><td>";str1+=arytmp[7]+"</td><td><a href=javascript:DelPin('"+arytmp[3].toString()+"')>X</a></td><td></tr>";}document.getElementById("PinStatusData").innerHTML=str1;}else document.getElementById("PinStatusData").innerHTML="";});}function onDelete(){f.iAct.value=2;f.submit();}function DelPin(pin){f.iAct.value=3;f.sDelPin.value=pin;f.submit();}function HSExport(){$http.get("/hsusbstatus.cgi?sFormAuthStr=ZChZ65B1x7oWVPs").then(function(response){if(response.data=="0"){alert(gettext("Please make sure that usbdisk is connected."));document.location.href="/cgi-bin/hotspot.cgi?sFormAuthStr=ZChZ65B1x7oWVPs&fid=3&iAct=0";}});document.location.href="/hspinexport.cgi?sFormAuthStr=ZChZ65B1x7oWVPs";}</script></body></html>
