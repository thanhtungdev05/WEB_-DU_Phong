</style></head><body class=ng-cloak><table align=center border=0 cellpadding=0 cellspacing=0 width=700><script> parent.printLogo(document,15,gettext('Local Certificate Signing'));</script><tr><td><hr size=1><br><form action=/cgi-bin/V2x00.cgi method=post name=frm1><table align=center border=0 cellpadding=2 cellspacing=0 width=100%><tr><td align=left><b translate>Local Certificate Signing</b></td></tr></table><table align=center border=1 cellpadding=2 cellspacing=0 width=100%><tr><td><table align=center border=0 cellpadding=2 cellspacing=0 width=100%><tr><td><b translate>Certificate Name</b></td><td><b id=cert_name></b></td></tr><tr><td colspan=2><hr size=1></td></tr><tr><td><b translate>Validity</b></td><td> &nbsp;YYYY-MM-DD </td></tr><tr><td>&nbsp;&nbsp;Not Before</td><td>&nbsp; <script> var sysTime=new Date(sysYear,sysMonth,sysDay,sysHour,sysMin,sysSec);var strCurrDate=sysTime.getFullYear()+"-"+(sysTime.getMonth()+1)+"-"+sysTime.getDate();document.write(strCurrDate.replace(/\b(\w)\b/g,'0$1'));</script></td></tr><tr><td>&nbsp;&nbsp;Not After</td><td><select name=NAY><script>for(i=0;i<10;i++){yyyy=sysYear+i;document.write("<option value="+yyyy+">"+yyyy+"</option>");}</script></select>-<select name=NAM><script>for(i=1;i<=12;i++){document.write("<option value="+(i-1)+">"+i+"</option>");}</script></select>-<select name=NAD><script>for(i=1;i<=31;i++){document.write("<option value="+i+">"+i+"</option>");}</script></select></td></tr><tr><td><b translate>Algorithm</b></td><td><select disabled name=isSha1><option selected translate value=0>SHA-256</option></select></td></tr><tr><td><b translate>Root CA</b></td><td><select name=sltRootCA size=1><script>var str="";for(var i=0;i<aryajaxrootca.length;i++){if(aryajaxrootca[i][0]=="")continue;str+="<option value="+aryajaxrootca[i][3]+">"+aryajaxrootca[i][0]+"</option>";}document.write(str);</script></select></td></tr></table><div id=signalert><br><table align=center border=0 cellpadding=2 cellspacing=0 id=alerttbl width=560><tr><td translate>For better security and to be compatible with most client OSes/Browsers, end-entity certificates validity period should be 395 days or less.</td></tr><tr><td align=center><br><input name=cfmOk onClick=onClkCfmOk() type=button value="Continue to sign">&nbsp;&nbsp; <input name=cfmCcl onClick=onClkCfmCcl() type=button value="Back to modify the validity period"></td></tr></table></div></td></tr></table><br><table align=left width=100%><tr><td><script>var aryNote=[gettext('For better security and to be compatible with most client OSes/Browsers, end-entity certificates validity period should be 395 days or less.')];document.write(parent.writeNote(aryNote));</script></td></tr></table><table align=center><tr><td align=center><input name=fid type=hidden value=1217><input name=locf_uid type=hidden value="0"><input name=rootca_uid type=hidden value="0"><input name=days type=hidden><input id=signbtn name=Sign onclick=SignRequest() style=position:relative type=button value="Sign">&nbsp; <input name=btnBack onclick=btnBck() type=button value="Back"></td></tr></table><input name=sFormAuthStr type=hidden value="ZChZ65B1x7oWVPs"></form></td></tr></table><script>top.ACTION_STATUS=-1;top.iActionStatusFlag='0';top.iFwUpgradeState='0';top.act_sta.damage_alert(); var f=document.frm1;var bg=parent;var wantTime;bg.setVle2Elmt(f.NAM,sysMonth,sysMonth);bg.setVle2Elmt(f.NAD,sysDay,sysDay);var signbtn=document.getElementById("signbtn");window.onbeforeunload=function(e){if(!signbtn.disabled){delete top.signState;}};if(top.cert_name){document.getElementById("cert_name").innerText=top.cert_name;delete top.cert_name;}function SignRequest(){wantTime=new Date(bg.getVleFromElmt(f.NAY,0),bg.getVleFromElmt(f.NAM,1),bg.getVleFromElmt(f.NAD,1),sysHour,sysMin,sysSec); if(bg.getVleFromElmt(f.NAD,1)!=wantTime.getDate()){alert(gettext("Please re-configure the date."));return false;}var days=parseInt((wantTime.getTime()-sysTime.getTime())/86400000);signbtn.disabled=true;bg.setVle2Elmt(f.days,days,days);if(days<=0){alert(gettext('The date you selected MUST NOT be earlier than "Not Before" date'));signbtn.disabled=false;return false;}else if(days>395){var alertPannel=document.getElementById("signalert");alertPannel.style.left=(signbtn.offsetLeft-205).toString()+"px";alertPannel.style.top=(signbtn.offsetTop-115).toString()+"px";alertPannel.style.display="block";return;}f.rootca_uid.value=bg.getVleFromElmt(f.sltRootCA,0);f.submit();return true;}function onClkCfmOk(){f.rootca_uid.value=bg.getVleFromElmt(f.sltRootCA,0);document.getElementById("signalert").style.display="none";f.submit();}function onClkCfmCcl(){document.getElementById("signalert").style.display="none";signbtn.disabled=false;}function btnBck(){var myUrl="/cgi-bin/v2x00.cgi?sFormAuthStr=ZChZ65B1x7oWVPs&fid="+1210;top.main.location.href=myUrl;}</script></body></html>
