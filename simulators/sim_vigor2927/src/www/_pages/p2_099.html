xLat<lts[i].lat())maxLat=lts[i].lat();else if(minLat>lts[i].lat())minLat=lts[i].lat();lngs.push(lts[i].lng());}var centerlat=(maxLat+minLat)/2;var centerlng=getCenterLng(lngs);var zoom0=getZoom(maxLat,minLat,lngs,centerlng);var geocoder=new google.maps.Geocoder();mapOptions={zoom:zoom0,center:new google.maps.LatLng(centerlat,centerlng),mapTypeId:google.maps.MapTypeId.ROADMAP};map=new google.maps.Map(document.getElementById("map_canvas"),mapOptions);for(var i=0;i<lts.length;++i){var marker=new google.maps.Marker({map:map,draggable:true,title:tips[i],position:lts[i]});}}angular.element(document).ready(function(){var map=null;var geocoder=new google.maps.Geocoder();var lts=[];gmap_req_cnt=cities.length;if(cities.length==0)showMap(lts);for(var i=0;i<cities.length;++i){(function(e){geocoder.geocode({'address':cities[i][4]},function(results,status){var str_title="";str_title+='DeviceName:'+cities[e][0]+'\r\n';str_title+='Name:'+cities[e][3]+'\r\n';str_title+='Model:'+cities[e][1]+'\r\n';str_title+='URL:'+cities[e][2]+'\r\n';str_title+='Address:'+cities[e][4]+'\r\n';gmap_req_cnt--;if(status==google.maps.GeocoderStatus.OK){lts.push(results[0].geometry.location);tips.push(str_title);}if(gmap_req_cnt==0){showMap(lts);}});})(i);}});</script><table align=center border=0 cellpadding=0 cellspacing=0 width=700><tr><td><b parent="VPN >> CPE Management" sub-title translate>Google Map</b><hr></td></tr><tr><td><table align=center border=0 cellpadding=0 cellspacing=0 width=100%><tr><td class=offtab id=tab1 onClick=onChgAccMod(1)><b translate>Managed Devices List</b></td><td class=offtab id=tab2 onClick=onChgAccMod(2)><b translate>CPE Maintenance</b></td><td class=ontab id=tab3 onClick=onChgAccMod(3)><b translate>Google Map</b></td><td width=30%></td><td> <a href="javascript: onRefresh()" translate>Refresh</a><td></tr></table><table border=1 cellpadding=0 cellspacing=0 width=100%><tr><td><div id=map_canvas style="width:100%; height:512px"></div></td></tr></table></table></body></html>
