WlessPhyMode);m.sWlessESSID=bg.getVleFromElmt(f.sWlessESSID);m.iWlessChannel=bg.getVleFromElmt(f.iWlessChannel);var mode=f.iWlessPhyMode.selectedIndex;var channel=f.iWlessChannel.selectedIndex;if(m.iWlessEnable==1)m.sWlessEnable="Enable";else m.sWlessEnable="Disable";m.sWlessPhyMode=f.iWlessPhyMode.options[mode].text;m.sWlessChannel=f.iWlessChannel.options[channel].text;document.location="wizbas5.htm";}function onClkBtnCcl(){if(confirm(gettext("Are you sure you want to cancel this wizard ?"))){if(('2927'=='2860')||('2927'=='2120')||('2927'=='2925')||('2927'=='2760')||('2927'=='130')){if(parseInt('0'))parent.location="/cgi-bin/cgidashboard.cgi?sFormAuthStr=oDe0nkdYY0OqGPW&fid=0";else parent.location="/cgi-bin/cgidashboard.cgi?sFormAuthStr=oDe0nkdYY0OqGPW&fid=1";}else{parent.location="/cgi-bin/V2X00.cgi?sFormAuthStr=oDe0nkdYY0OqGPW&fid=2015";}}}</script></body></html>
