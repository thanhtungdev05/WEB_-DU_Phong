<!DOCTYPE html><html ng-app=myApp ng-controller=TranslateCtrl><head><script src="/js/gettext.min.js?094907"></script><meta / charset=UTF-8><link href="/style.min.css?094907" rel=stylesheet type=text/css><link / href=/images/favicon.ico rel="shortcut icon"><title>URL Content Filter Wizard&nbsp;(1/3)</title></head><body class=ng-cloak><table align=center border=0 cellpadding=0 cellspacing=0 width=650><tr><td class=title>URL Content Filter Wizard (1/3)</td><tr><tr><td><hr size=1><br><form name=frm1><table align=center border=0 cellpadding=2 cellspacing=0 width=100%><tr><td><b translate>URL Access Control</b></td></tr></table><table align=center border=1 cellspacing=0 width=100%><tr><td><br><table align=center border=0 cellpadding=2 cellspacing=0 width=90%><tr><td>Object Name:</td><td><input maxlength=15 name=sProfileName type=text></td><td><input class=btnw name=sProfAdd onclick=onClkAdd() type=button value="Add">&nbsp;&nbsp; <input class=btnw name=sProfDel onclick=onClkDel() type=button value="Delete"></td></tr><tr><td>Pattern Contents:</td><td colspan=2><input maxlength=63 name=sKwObjContents size=50 type=text></td></tr><tr><td>&nbsp;</td><td colspan=2><font color=#FF0000><b translate>Limit of Contents</b></font>: Max <font><b>3</b></font> Words and <font><b>63</b></font> Characters.<br>Each word should be separated by a single space.<br></td></tr><tr><td colspan=3>&nbsp;</td></tr><tr align=center><td colspan=3><select multiple name=slturl onchange=onChgSltUrl() size=3 style=width:450px;height:160px;font-family:Courier;></td></tr></table></td></tr></table><br><table align=right><tr><td><input class=btnw disabled name=btnNxt type=button value="Previous">&nbsp; <input class=btnw name=btnNxt onclick=onClkNxt() type=button value="Next">&nbsp; <input class=btnw name=btnCls onclick=onClkCcl() type=button value="Cancel"></td></tr></table><input name=sFormAuthStr type=hidden value="oDe0nkdYY0OqGPW"></form></td></tr></table><script> top.ACTION_STATUS=-1;top.iFwUpgradeState='0';opener.top.act_sta.damage_alert();var bg=window.opener.parent;var f=document.frm1;var aryKeyWdList=new Array();var AddProfNum=0;angular.element(document).ready(function(){initParament();});function initParament(){if(bg.iUrlWizPage>1){for(var i=0;i<bg.iUrlWizNam.length;i++){aryKeyWdList[i]=new Array(2);aryKeyWdList[i][0]=bg.iUrlWizNam[i];aryKeyWdList[i][1]=bg.iUrlWizCont[i];}AddProfNum=bg.iUrlWizNam.length;}if(aryKeyWdList.length==3)f.sProfAdd.disabled=true;if(aryKeyWdList.length==0)f.sProfDel.disabled=true;initSelect();showSltUrl();angular.element(document.querySelector("#link_mxwdandchar font")).attr("color","#FF0000");}function initSelect(){f.slturl.options[0]=new Option(bg.strFormat(gettext("Index"),6)+bg.strFormat(gettext("URL Name"),17)+bg.strFormat(gettext("Content"),9));for(var i=1;i<f.slturl.options.length;){f.slturl.options[i]=null;}}function showSltUrl(){var i,idx,content;for(i=1;i<f.slturl.options.length;){f.slturl.options[i]=null;}if(aryKeyWdList==null)return;for(i=0;i<aryKeyWdList.length;i++){idx=i+1;if(aryKeyWdList[i][1].length>8)content=aryKeyWdList[i][1].substring(0,8)+"..";else content=aryKeyWdList[i][1];f.slturl.options[idx]=new Option(bg.strFormat(idx,5)+bg.strFormat(aryKeyWdList[i][0],17)+bg.strFormat(content,9));f.slturl.options[idx].title=aryKeyWdList[i][1];}}function onClkAdd(){var sProfileName=bg.getVleFromElmt(f.sProfileName,0);var sKwObjContents=bg.getVleFromElmt(f.sKwObjContents,0);if(sProfileName==""||sKwObjContents=="")return;aryKeyWdList[AddProfNum]=new Array(2);aryKeyWdList[AddProfNum][0]=sProfileName;aryKeyWdList[AddProfNum][1]=sKwObjContents;AddProfNum++;if(AddProfNum>=bg.arykeywdidx.length)f.sProfAdd.disabled=true;if(AddProfNum>0)f.sProfDel.disabled=false;bg.setVle2Elmt(f.sProfileName,"",0);bg.setVle2Elmt(f.sKwObjContents,"",0);showSltUrl();}function onClkDel(){var idx,i,j;idx=f.slturl.selectedIndex;if(idx!=-1){for(i=1,j=0;i<f.slturl.options.length;i++,j++){if(f.slturl.options[i].selected==true){aryKeyWdList=aryKeyWdList.slice(0,j).concat(aryKeyWdList.slice(j+1));j--;AddProfNum--;}}if(AddProfNum<bg.arykeywdidx.length)f.sProfAdd.disabled=false;if(AddProfNum==0)f.sProfDel.disabled=true;bg.setVle2Elmt(f.sProfileName,"",0);bg.setVle2Elmt(f.sKwObjContents,"",0);showSltUrl();}}function onChgSltUrl(){var idx=f.slturl.selectedIndex;if((idx!=-1)&&(idx!=0)){f.sProfileName.value=aryKeyWdList[idx-1][0];f.sKwObjContents.value=aryKeyWdList[idx-1][1];}}function onClkNxt(){bg.iUrlWizPage=1;bg.iUrlWizNam=new Array();bg.iUrlWizCont=new Array();for(var i=0;i<aryKeyWdList.length;i++){bg.iUrlWizNam[i]=aryKeyWdList[i][0];bg.iUrlWizCont[i]=aryKeyWdList[i][1];}if(opener.CheckFext())document.location.href="/doc/urlwiz2.htm";else document.location.href="/doc/urlwiz3.htm";}function onClkCcl(){bg.iUrlWizPage=0; self.close();}</script></body></html>
