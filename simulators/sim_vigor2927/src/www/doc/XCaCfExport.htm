<!DOCTYPE html><html ng-app=myApp ng-controller=TranslateCtrl><head><script src="/js/gettext.min.js?094907"></script><link href="/style.min.css?094907" rel=stylesheet type=text/css></head><body class=ng-cloak><table align=center border=0 cellpadding=0 cellspacing=0 width=520><tr><td><table align=center border=0 cellpadding=2 cellspacing=0 width=95%><tr><td><b translate>Export X509 RootCA Certificate</b></td></tr><tr><td><table align=center border=1 cellpadding=0 cellspacing=0 width=100%><tr><td><form name=frm1><table align=center border=0 cellpadding=0 cellspacing=4 width=95%><tr><td colspan=2>Select an export format:</td></tr><tr><td width=2%><input name=iExportType onClick=clkExportType(0) type=radio value=0></td><td translate>CRT</td></tr><tr><td><input name=iExportType onClick=clkExportType(1) type=radio value=1></td><td translate>PKCS#12</td></tr><tr class=PKCS12 style=display:none><td>&nbsp;</td><td translate>Please enter a password to encrypt the PKCS#12 file.</td></tr><tr class=PKCS12 style=display:none><td>&nbsp;</td><td><form method=post name=frmbak><table border=0 cellpadding=0 cellspacing=2><tr><td translate width=40%>Password</td><td><input maxlength=64 name=pwd placeholder="Max: ###LEN### characters" type=password></td></tr><tr><td translate>Confirm Password</td><td><input maxlength=64 name=confirmpwd type=password></td></tr><tr><td colspan=2 translate translate-params-words="'1-9, A-Z, a-z, and ,;:<>+=|?@#^!()'">Note: Only {{words}} are allowed.</td></tr></table></form></td></tr></table></form></td></tr></table></td></tr></table><br><table align=center width=100%><tr><td align=center><input class=btnw name=btnExport onclick=onClkExport() type=button value="Export">&nbsp;&nbsp; <input class=btnw name=btnCancel onclick=self.close(); type=button value="Cancel"></td></tr></table></td></tr></table><script> var bg=opener.parent;var tp=opener.top;tp.ACTION_STATUS=-1;tp.iActionStatusFlag='0';tp.iFwUpgradeState='0';tp.act_sta.damage_alert();var f=document.frm1;var fbak=document.frmbak;angular.element(document).ready(function(){initPage();});function initPage(){bg.setVle2Elmt(f.iExportType[0],0);angular.forEach(document.querySelectorAll("input[placeholder]"),function(self){self.placeholder=self.placeholder.replace("###LEN###",self.maxLength);});}function onClkExport(){var iType=bg.getVleFromElmt(f.iExportType[0],0);if(isNaN(top.rootca_idx)){top.rootca_idx=0;}if(iType==0){var myUrl="/RootCA.crt?"+top.rootca_idx+"&sFormAuthStr=oDe0nkdYY0OqGPW";document.location.href=myUrl;}else if(iType==1){var passwd=fbak.pwd.value;var passwd_confirm=fbak.confirmpwd.value;if(passwd==""){alert(gettext("Please input the password."));return false;}if(passwd!=passwd_confirm){alert(gettext("Passwords do not match. Please re-enter."));return false;}if(passwd.match(/[^a-zA-Z0-9,;:<>\+=\\\|\?@#\^!\(\)]/)){alert(gettext("Illegal character in password, please check!"));return false;}fbak.action='/RootCA.p12?'+top.rootca_idx+'&sFormAuthStr=oDe0nkdYY0OqGPW';fbak.submit();}}function clkExportType(_itype){width=560;if(_itype==1){bg.showElmtByClass(document,"tr","PKCS12");height=360;window.resizeTo(width,height);}else{bg.hideElmtByClass(document,"tr","PKCS12");height=260;window.resizeTo(width,height);}}</script></body></html>
