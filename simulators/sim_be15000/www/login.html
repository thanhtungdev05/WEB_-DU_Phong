(function(){
  function vao(){
    var u=(document.getElementById('Frm_Username')||{}).value||'';
    var p=(document.getElementById('Frm_Password')||{}).value||'';
    if(!u.trim()||!p.trim()){ alert('Please enter username and password.'); return; }
    location.href='pages/localNetStatus.html';
  }
  var btn=document.getElementById('LoginId');
  if(btn) btn.addEventListener('click',function(e){e.preventDefault();vao();});
  ['Frm_Username','Frm_Password'].forEach(function(id){
    var el=document.getElementById(id);
    if(el) el.addEventListener('keydown',function(e){ if(e.key==='Enter'){e.preventDefault();vao();} });
  });
})();
</script>
