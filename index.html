<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FTC - Giả lập Thiết bị</title>
  <link rel="icon" type="image/png" href="/assets/logoFPT.png?v=58a119fe563bd62a">
  <script>
    const rawSearch = window.location.search;
    const query = new URLSearchParams(rawSearch);
    const isIamCallback = query.has('code') || query.has('state') || query.has('error');
    const state = query.get('state') || '';

    function decodeBase64Url(value) {
      const base64 = value.replace(/-/g, '+').replace(/_/g, '/');
      const padded = base64.padEnd(Math.ceil(base64.length / 4) * 4, '=');
      return atob(padded);
    }

    function localCallbackUrl() {
      if (!state.startsWith('ftc-local-dev.')) {
        return null;
      }

      try {
        const originPart = state.split('.')[1] || '';
        const origin = new URL(decodeBase64Url(originPart));
        const isLocalHost = ['localhost', '127.0.0.1', '::1'].includes(origin.hostname);
        if (origin.protocol !== 'http:' || !isLocalHost) {
          return null;
        }
        return `${origin.origin}/api/index.php/iam/callback${rawSearch}`;
      } catch (error) {
        return null;
      }
    }

    let alreadyConsumedCallback = false;
    if (isIamCallback && state) {
      try {
        if (sessionStorage.getItem('ftc_consumed_iam_state') === state) {
          alreadyConsumedCallback = true;
        } else {
          sessionStorage.setItem('ftc_consumed_iam_state', state);
        }
      } catch (error) {}
    }

    if (isIamCallback && window.history && typeof window.history.replaceState === 'function') {
      try {
        window.history.replaceState({}, document.title, window.location.pathname || '/');
      } catch (error) {}
    }

    const localTarget = localCallbackUrl();
    const target = isIamCallback
      ? (alreadyConsumedCallback ? 'portal.html' : (localTarget || `api/index.php/iam/callback${rawSearch}`))
      : 'login/index.html';

    window.location.replace(target);
  </script>
</head>
<body>
  <p>Đang chuyển hướng… <a href="login/index.html">Tiếp tục</a></p>
</body>
</html>
